<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<script src="assets/theme.js"></script>
<title>기출문제 풀기 · 수학을 보다</title>
<meta name="description" content="태블릿 펜으로 기출문제 PDF 위에 직접 풀이하는 화면입니다." />

<!-- 카카오톡·문자로 이 페이지 링크를 공유할 때 보이는 미리보기 -->
<meta property="og:type" content="website" />
<meta property="og:url" content="https://guns-math.vercel.app/solve.html" />
<meta property="og:title" content="기출문제 풀기 · 수학을 보다" />
<meta property="og:description" content="태블릿 펜으로 기출문제 PDF 위에 직접 풀이하는 화면입니다." />
<meta property="og:locale" content="ko_KR" />
<meta property="og:image" content="https://guns-math.vercel.app/assets/og.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="수학을 보다 — 단위원과 사인 곡선 그림" />
<meta name="twitter:card" content="summary_large_image" />

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='13.5' cy='13.5' r='9' fill='%23d9f26e'/%3E%3Cpath d='M6 16q3.75-8 7.5-2.5t7.5-2.5' fill='none' stroke='%23000' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='13.5' cy='13.5' r='9' fill='none' stroke='%23000' stroke-width='2.5'/%3E%3Cpath d='M20 20l7.5 7.5' stroke='%23000' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="assets/vendor/fonts/pretendard.css" />
<link rel="stylesheet" href="assets/vendor/fonts/jetbrains-mono.css" />
<link rel="stylesheet" href="assets/style.css" />
<link rel="stylesheet" href="assets/solve.css" />
</head>
<body class="solve-body">
<header class="solve-head">
  <a class="solve-back" id="backLink" href="files.html" aria-label="자료실로 돌아가기">← <span>자료실</span></a>
  <div class="solve-title">
    <strong id="examTitle">기출문제를 불러오는 중</strong>
    <span id="examMeta">잠시만 기다려 주세요.</span>
  </div>
  <div class="solve-head-actions">
    <span class="save-state" id="saveState" role="status">자동 저장</span>
    <button class="icon-button" id="fullscreenButton" type="button" aria-label="전체 화면">⛶</button>
  </div>
</header>

<main class="solve-app">
  <section class="solve-toolbar" aria-label="풀이 도구">
    <div class="tool-group page-tools" aria-label="페이지 이동">
      <button type="button" class="tool-button" id="prevPage" aria-label="이전 페이지">←</button>
      <label class="page-field"><input id="pageNumber" type="number" min="1" value="1" inputmode="numeric" aria-label="현재 페이지" /><span>/ <b id="pageCount">–</b></span></label>
      <button type="button" class="tool-button" id="nextPage" aria-label="다음 페이지">→</button>
    </div>
    <div class="tool-divider" aria-hidden="true"></div>
    <div class="tool-group" role="group" aria-label="필기 도구">
      <button type="button" class="tool-button tool-mode" data-tool="hand" aria-pressed="false"><span aria-hidden="true">☝</span> 이동</button>
      <button type="button" class="tool-button tool-mode on" data-tool="pen" aria-pressed="true"><span class="tool-dot pen-dot" aria-hidden="true"></span> 펜</button>
      <button type="button" class="tool-button tool-mode" data-tool="line" aria-pressed="false"><span aria-hidden="true">╱</span> 직선</button>
      <button type="button" class="tool-button tool-mode" data-tool="rect" aria-pressed="false"><span aria-hidden="true">□</span> 사각형</button>
      <button type="button" class="tool-button tool-mode" data-tool="ellipse" aria-pressed="false"><span aria-hidden="true">○</span> 원</button>
      <button type="button" class="tool-button tool-mode" data-tool="highlighter" aria-pressed="false"><span class="tool-dot highlighter-dot" aria-hidden="true"></span> 형광펜</button>
      <button type="button" class="tool-button tool-mode" data-tool="eraser" aria-pressed="false"><span aria-hidden="true">◇</span> 지우개</button>
    </div>
    <div class="tool-group ink-settings" aria-label="필기 설정">
      <div class="ink-colors" role="group" aria-label="필기 색상">
        <button type="button" class="ink-color" data-ink-color="#19364a" aria-label="남색"></button><button type="button" class="ink-color" data-ink-color="#111111" aria-label="검정"></button><button type="button" class="ink-color" data-ink-color="#1769aa" aria-label="파랑"></button><button type="button" class="ink-color" data-ink-color="#c93636" aria-label="빨강"></button><button type="button" class="ink-color" data-ink-color="#198754" aria-label="초록"></button><button type="button" class="ink-color" data-ink-color="#ffd928" aria-label="노랑"></button>
      </div>
      <label class="stroke-size">굵기 <input id="strokeSize" type="range" min="1" max="5" step="1" value="2"><output id="strokeSizeValue">2</output></label>
    </div>
    <div class="tool-group guide-tools" aria-label="수학 보조선">
      <button type="button" class="tool-button" id="gridToggle" aria-pressed="false"><span aria-hidden="true">▦</span> 모눈</button>
      <button type="button" class="tool-button" id="axesToggle" aria-pressed="false"><span aria-hidden="true">＋</span> 좌표축</button>
      <label class="snap-toggle"><input id="snapToGrid" type="checkbox"> 격자 맞춤</label>
    </div>
    <div class="tool-group compact-tools" aria-label="편집">
      <button type="button" class="tool-button" id="undoButton" title="되돌리기 (Ctrl+Z)" aria-label="되돌리기">↶</button>
      <button type="button" class="tool-button" id="redoButton" title="다시 실행 (Ctrl+Shift+Z)" aria-label="다시 실행">↷</button>
      <button type="button" class="tool-button danger-button" id="clearButton">현재 쪽 지우기</button>
    </div>
    <div class="tool-spacer"></div>
    <label class="finger-toggle"><input id="fingerDraw" type="checkbox" /> 손가락 필기</label>
    <div class="tool-group zoom-tools" aria-label="확대와 축소">
      <button type="button" class="tool-button" id="zoomOut" aria-label="축소">−</button>
      <button type="button" class="tool-button zoom-value" id="zoomFit" title="화면 너비에 맞추기">맞춤</button>
      <button type="button" class="tool-button" id="zoomIn" aria-label="확대">＋</button>
    </div>
  </section>

  <section class="document-area" id="documentArea" aria-label="문제 풀이 영역">
    <div class="loading-card" id="loadingCard">
      <span class="loading-spinner" aria-hidden="true"></span>
      <strong id="loadingTitle">문제지를 준비하고 있습니다.</strong>
      <span id="loadingDetail">PDF를 불러오는 중입니다.</span>
    </div>
    <div class="paper" id="paper" hidden>
      <canvas id="pdfCanvas" aria-label="문제지"></canvas>
      <canvas id="inkCanvas" aria-label="필기 영역"></canvas>
    </div>
  </section>

  <footer class="solve-footer">
    <div class="timer" aria-label="풀이 시간">
      <label for="timerLimit">제한시간</label>
      <select id="timerLimit" aria-label="제한시간 선택">
        <option value="0">자유 풀이</option><option value="10">10분</option><option value="20">20분</option>
        <option value="30">30분</option><option value="40">40분</option><option value="50">50분</option>
        <option value="80">80분</option><option value="100" selected>100분</option>
      </select>
      <strong id="timerValue">01:40:00</strong>
      <button type="button" id="timerToggle">시작</button>
      <button type="button" id="timerReset">초기화</button>
    </div>
    <div class="solve-footer-actions">
      <button type="button" id="saveImageButton">현재 쪽 이미지 저장</button>
      <button type="button" class="submit-button" id="submitSolutionButton">풀이 제출</button>
      <details class="check-panel">
        <summary>채점하기</summary>
        <div class="check-links" id="checkLinks"><span>정답 자료를 준비하고 있습니다.</span></div>
      </details>
    </div>
  </footer>
</main>

<dialog class="solve-dialog" id="timeUpDialog">
  <div class="dialog-mark" aria-hidden="true">00:00</div>
  <h2>제한시간이 끝났습니다.</h2>
  <p>작성한 내용은 그대로 저장되어 있습니다. 지금 제출하거나 시간을 넘겨 계속 풀 수 있습니다.</p>
  <div class="dialog-actions">
    <button type="button" class="primary-dialog-button" id="timeUpSubmit">풀이 제출</button>
    <button type="button" id="continueOvertime">계속 풀기</button>
  </div>
</dialog>

<dialog class="solve-dialog submit-dialog" id="submissionDialog">
  <form id="submissionForm">
    <button type="button" class="dialog-close" data-close-dialog aria-label="닫기">×</button>
    <span class="dialog-kicker">풀이 제출</span>
    <h2>선생님께 보낼 정보를 적어 주세요.</h2>
    <label>학번 또는 이름 <input type="text" name="student" maxlength="30" placeholder="예: 20312 홍길동" autocomplete="name" required /></label>
    <label>선생님께 남길 말 <input type="text" name="note" maxlength="120" placeholder="선택 사항" /></label>
    <p class="submission-summary" id="submissionSummary"></p>
    <p class="privacy-note">학번·이름, 필기 내용과 풀이 시간이 선생님 방에 90일 동안 보관됩니다.</p>
    <p class="dialog-status" id="submissionStatus" role="status" aria-live="polite"></p>
    <div class="dialog-actions">
      <button type="submit" class="primary-dialog-button">제출하기</button>
      <button type="button" data-close-dialog>취소</button>
    </div>
  </form>
</dialog>

<div class="solve-toast" id="solveToast" role="status" aria-live="polite"></div>
<script type="module" src="assets/solve.js"></script>
<script defer src="/_vercel/insights/script.js"></script>
<script defer src="/assets/hit.js"></script>
</body>
</html>
