<script src="assets/demos.js"></script>

<script>
const grid = document.getElementById("grid");
const subjectNav = document.getElementById("subjectNav");
let query = "";

function render() {
  const list = DEMOS.filter(d => {
    const hay = (d.title + d.subject + d.unit + d.desc + d.use + d.keywords + d.year).toLowerCase();
    return !query || hay.includes(query);
  });

  grid.innerHTML = "";
  subjectNav.innerHTML = "";

  if (!list.length) {
    grid.innerHTML = '<p class="empty">조건에 맞는 자료가 아직 없습니다.</p>';
    return;
  }

  /* --- 과목 묶음 (검색 결과에 있는 과목만) ---
     묶는 순서는 DEMOS 배열 순서가 아니라 SUBJECTS 에 적어 둔 순서를 따른다.
     예전에는 배열을 훑다가 과목이 바뀔 때마다 제목을 만들었는데, 그러면
     새 자료를 배열 아무 데나 넣었을 때 같은 과목 제목이 두 번 생기고
     같은 id 가 두 개가 되어 바로가기가 엉켰다. 이제는 배열 어디에 넣어도 된다. */
  const order = Object.keys(SUBJECTS);
  const found = [...new Set(list.map(groupOf))];
  const groups = order.filter(n => found.includes(n))
    .concat(found.filter(n => !order.includes(n)));   // SUBJECTS 에 없는 과목은 뒤에

  subjectNav.innerHTML = groups.map(name => {
    const m = meta(name);
    const n = list.filter(x => groupOf(x) === name).length;
    return `<a href="#${m.id}"><span class="dot" style="background:${m.color}"></span>` +
           `${name}<span class="n">${n}</span></a>`;
  }).join("");

  // --- 카드 ---
  for (const name of groups) {
    const m = meta(name);
    const items = list.filter(d => groupOf(d) === name);

    const head = document.createElement("div");
    head.className = "grid-head";
    head.id = m.id;
    head.innerHTML =
      `<span class="dot" style="background:${m.color}"></span>` +
      `<h2>${name}</h2>` +
      `<span class="caption">${items.length}개</span>`;
    grid.appendChild(head);

    for (const d of items) {
      const el = document.createElement(d.ready ? "a" : "div");
      el.className = "card" + (d.ready ? "" : " soon");
      if (d.ready) el.href = d.href;
      el.innerHTML = `
        <div class="thumb" style="background:${m.color}">${d.fig}</div>
        <div class="card-top">
          <span class="caption">${d.subject} · ${d.unit}</span>
          ${d.d3 ? '<span class="tag-3d">3D</span>' : ""}
          ${d.ready ? "" : '<span class="caption">준비 중</span>'}
        </div>
        <h3>${d.title}</h3>
        <p class="use"><b>이럴 때</b><span>${d.use}</span></p>
        ${d.ready ? '<span class="go">열어 보기 →</span>' : ""}`;
      grid.appendChild(el);
    }
  }
}

document.getElementById("q").addEventListener("input", e => {
  query = e.target.value.trim().toLowerCase();
  render();
});

render();

// '맨 위로' 단추 — 한 화면쯤 내려간 뒤부터 보입니다.
{

  const sync = () => toTop.classList.toggle("show", scrollY > 600);
  addEventListener("scroll", sync, { passive: true });
  sync();
}
