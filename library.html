<!-- 자료 목록은 홈(index.html)과 함께 쓰므로 따로 빼 두었습니다 -->
<script src="assets/demos.js"></script>

<script>
const grid = document.getElementById("grid");
const subjectNav = document.getElementById("subjectNav");
let query = "";
const params = new URLSearchParams(location.search);
let selectedGrade = ["1", "2", "3"].includes(params.get("grade")) ? params.get("grade") : "all";
const gradeNumbers = d => [...new Set((String(d.year).match(/[123]/g) || []))];
const gradeMatches = d => selectedGrade === "all" || gradeNumbers(d).includes(selectedGrade);

function renderGradeFilter() {
  const labels = { all: "전체", 1: "1학년", 2: "2학년", 3: "3학년" };
  document.getElementById("gradeFilter").innerHTML = ["all", "1", "2", "3"].map(g => {
    const n = g === "all" ? DEMOS.length : DEMOS.filter(d => gradeNumbers(d).includes(g)).length;
    return `<button type="button" class="${selectedGrade === g ? "on" : ""}" data-grade="${g}" aria-pressed="${selectedGrade === g}">${labels[g]} <span>${n}</span></button>`;
  }).join("");
}

/* 자료가 모두 몇 개인지 — 세어서 씁니다.
   예전에는 이 숫자를 페이지 곳곳에 손으로 적어 두었는데, 자료를 늘려도
   숫자는 그대로라 실제와 어긋났습니다(17 이라고 적힌 채 23개가 됨). */
document.getElementById("총개수").textContent = `모두 ${DEMOS.length}개`;

function render() {
  const list = DEMOS.filter(d => {
    const hay = (d.title + d.subject + d.unit + d.desc + d.use + d.keywords + d.year).toLowerCase();
    return gradeMatches(d) && (!query || hay.includes(query));
  });

  grid.innerHTML = "";
  subjectNav.innerHTML = "";
  renderGradeFilter();
  document.getElementById("총개수").textContent = selectedGrade === "all"
    ? `모두 ${DEMOS.length}개`
    : `${selectedGrade}학년 자료 ${list.length}개`;

  if (!list.length) {
    grid.innerHTML = '<p class="empty">조건에 맞는 자료가 아직 없습니다.</p>';
    return;
  }

  /* --- 과목 묶음 (검색 결과에 있는 과목만) ---
     묶는 순서는 DEMOS 배열 순서가 아니라 SUBJECTS 에 적어 둔 순서를 따른다.
     예전에는 배열을 훑다가 과목이 바뀔 때마다 제목을 만들었는데, 그러면
     새 자료를 배열 아무 데나 넣었을 때 같은 과목 제목이 두 번 생기고
     같은 id 가 두 개가 되어 바로가기가 엉켰다. 이제는 배열 어디에 넣어도 된다. */
  const order = Object.keys(SUBJECTS);
  const found = [...new Set(list.map(groupOf))];
  const groups = order.filter(n => found.includes(n))
    .concat(found.filter(n => !order.includes(n)));   // SUBJECTS 에 없는 과목은 뒤에

  subjectNav.innerHTML = groups.map(name => {
    const m = meta(name);
    const n = list.filter(x => groupOf(x) === name).length;
    return `<a href="#${m.id}"><span class="dot" style="background:${m.color}"></span>` +
           `${name}<span class="n">${n}</span></a>`;
  }).join("");

  // --- 카드 ---
  for (const name of groups) {
    const m = meta(name);
    const items = list.filter(d => groupOf(d) === name);

    const head = document.createElement("div");
    head.className = "grid-head";
    head.id = m.id;
    head.innerHTML =
      `<span class="dot" style="background:${m.color}"></span>` +
      `<h2>${name}</h2>` +
      `<span class="caption">${items.length}개</span>`;
    grid.appendChild(head);

    for (const d of items) {
      const el = document.createElement("article");
      el.className = "card" + (d.ready ? "" : " soon");
      const grade = selectedGrade === "all" ? (gradeNumbers(d)[0] || "common") : selectedGrade;
      const examSubject = grade === "3"
        ? (/미적분/.test(d.subject) ? "미적분" : d.subject)
        : "수학";
      const related = "files.html?" + new URLSearchParams({ grade, q: examSubject }).toString();
      const worksheet = "files.html?" + new URLSearchParams({ grade, kind: "학습지", q: d.subject }).toString();
      const cardBody = `
        <div class="thumb" style="background:${m.color}">${d.fig}</div>
        <div class="card-top">
          <span class="caption">${d.year} · ${d.subject} · ${d.unit}</span>
          ${d.d3 ? '<span class="tag-3d">3D</span>' : ""}
          ${d.ready ? "" : '<span class="caption">준비 중</span>'}
        </div>
        <h3>${d.title}</h3>
        <p class="use"><b>이럴 때</b><span>${d.use}</span></p>
        ${d.ready ? '<span class="go">열어 보기 →</span>' : ""}`;
      el.innerHTML = d.ready
        ? `<a class="card-main" href="${d.href}">${cardBody}</a>
           <div class="card-related" aria-label="${d.title} 관련 자료">
             <a href="${related}">관련 기출</a>
             <a href="${worksheet}">관련 학습지</a>
           </div>`
        : cardBody;
      grid.appendChild(el);
    }
  }
}

document.getElementById("gradeFilter").addEventListener("click", e => {
  const button = e.target.closest("[data-grade]");
  if (!button) return;
  selectedGrade = button.dataset.grade;
  const next = new URL(location.href);
  selectedGrade === "all" ? next.searchParams.delete("grade") : next.searchParams.set("grade", selectedGrade);
  history.replaceState(null, "", next);
  render();
});

document.getElementById("q").addEventListener("input", e => {
  query = e.target.value.trim().toLowerCase();
  render();
});

render();

// '맨 위로' 단추 — 한 화면쯤 내려간 뒤부터 보입니다.
{
  const toTop = document.querySelector(".to-top");
  const sync = () => toTop.classList.toggle("show", scrollY > 600);
  addEventListener("scroll", sync, { passive: true });
  sync();
}
