<!-- ===================== 자료실 ===================== -->
<section class="section" id="files" style="padding-top: var(--xxl);">
  <div class="wrap">
    <div class="section-head">
      <span class="eyebrow">Files</span>
      <div>
        <h1 class="display-lg">자료실</h1>
        <p class="body-lg">
          수업에서 나눠 준 학습지와 정리 프린트입니다. 제목을 누르면 내려받습니다.
          화면에서 직접 움직여 보는 것은 <a href="library.html">직접 보는 수학</a>에 있습니다.
        </p>
      </div>
    </div>

    <!-- 선생님이 파일을 올리는 칸. 평소엔 숨어 있고, 주소 끝에 ?admin 을 붙여
         들어와 암호를 넣었을 때만 나타납니다. (질문 페이지와 같은 암호) -->

    <div id="fileList"></div>
  </div>
</section>

<!-- ===================== 푸터 ===================== -->
<footer class="footer">
  <div class="wrap">

      <a class="footer-wordmark" href="index.html">수학을 보다</a>

        <li><a href="library.html">직접 보는 수학</a></li>
        <li><a href="map.html">개념 지도</a></li>
        <li><a href="files.html">자료실</a></li>
        <li><a href="ask.html">질문</a></li>
      </ul>
    </div>
    <p class="footer-base body-sm">수업에서 쓰라고 만든 자료입니다. 출처만 밝히면 자유롭게 쓰셔도 됩니다.</p>
  </div>
</footer>

<script>
/* =========================================================
   자료실 — 손대지 않아도 됩니다.

   선생님이 파일을 올리면(주소 끝에 ?admin, 암호는 질문 페이지와 같음)
   사이트 저장소에 들어가고 곧바로 목록에 뜹니다. 학생은 그냥 눌러서
   내려받습니다.
   ========================================================= */
{
  const 자리 = document.getElementById("fileList");
  const 관리칸 = document.getElementById("adminBar");

  let 파일들 = [];
  let 암호 = sessionStorage.getItem("수학을보다-암호") || "";

  const 안전하게 = 글 => String(글 ?? "").replace(/[&<>"']/g, 기호 => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[기호]));

  const 크기표시 = 바이트 => {
    if (!바이트) return "";
    const kb = 바이트 / 1024;
    return kb < 1024 ? `${Math.round(kb)}KB` : `${(kb / 1024).toFixed(1)}MB`;
  };

  function 안내만(글) {
    자리.className = "";
    자리.innerHTML = `<p class="empty">${글}</p>`;
  }

  function 그리기() {
    if (!파일들.length) return 안내만("아직 올린 파일이 없습니다.");

    자리.className = "filelist";
    자리.innerHTML = 파일들.map(f => `
      <div class="filelist-row">
        <a href="${안전하게(f.url)}" target="_blank" rel="noopener">
          <span class="caption filelist-date">${안전하게(f.date)}</span>
          <span class="filelist-main">
            <b>${안전하게(f.title)}</b>
            <span class="caption">${[f.subject, f.kind, 크기표시(f.size)].filter(Boolean).map(안전하게).join(" · ")}</span>
          </span>
          <span class="filelist-go" aria-hidden="true">내려받기 ↓</span>
        </a>
        ${암호 ? `<button type="button" class="fadmin-del" data-id="${안전하게(f.id)}">지우기</button>` : ""}
      </div>`).join("");
  }

  async function 불러오기() {
    try {
      const 응답 = await fetch("/api/files");
      if (응답.status === 503) return 안내만("자료실을 준비하고 있습니다.");
      if (!응답.ok) throw new Error();
      파일들 = await 응답.json();
      그리기();
    } catch {
      안내만("목록을 불러오지 못했습니다. 잠시 뒤 새로고침해 주세요.");
    }
  }

  /* ---------- 선생님: 지우기 ---------- */
  자리.addEventListener("click", async e => {
    const 버튼 = e.target.closest(".fadmin-del");
    if (!버튼) return;
    if (!confirm("이 파일을 지울까요? 되돌릴 수 없습니다.")) return;
    버튼.disabled = true;
    try {
      const 응답 = await fetch(`/api/files-admin?act=delete&id=${encodeURIComponent(버튼.dataset.id)}&암호=${encodeURIComponent(암호)}`, { method: "POST" });
      const 결과 = await 응답.json();
      if (!응답.ok) throw new Error(결과.오류 || "");
      파일들 = 파일들.filter(f => f.id !== 버튼.dataset.id);
      그리기();
    } catch (err) {
      alert(err.message || "지우지 못했습니다.");
      버튼.disabled = false;
    }
  });

  /* ---------- 선생님: 올리기 폼 ---------- */
  function 올리기폼그리기() {
    관리칸.innerHTML = `<form class="fadmin-upload" id="파일올리기">
      <div class="fadmin-row">
        <input type="text" name="title" placeholder="제목 (예: 미분계수 연습 20제)" required />
        <input type="text" name="subject" placeholder="과목 (예: 미적분Ⅰ)" />
        <input type="text" name="kind" placeholder="종류 (예: 학습지)" />
      </div>
      <div class="fadmin-row">
        <input type="file" name="file" accept=".pdf,.hwp,.hwpx" required />
        <button type="submit" class="btn btn-secondary">올리기 ↑</button>
        <button type="button" id="관리끄기">끄기</button>
      </div>
      <p class="caption fadmin-status" role="status" aria-live="polite"></p>
    </form>`;

    document.getElementById("관리끄기").onclick = () => {
      암호 = "";
      sessionStorage.removeItem("수학을보다-암호");
      관리칸.innerHTML = "";
      그리기();
    };

    const 폼 = document.getElementById("파일올리기");
    const 쪽지 = 폼.querySelector(".fadmin-status");
    폼.addEventListener("submit", async e => {
      e.preventDefault();
      const 파일 = 폼.file.files[0];
      if (!파일) return;

      const 확장자 = (파일.name.split(".").pop() || "").toLowerCase();
      if (!["pdf", "hwp", "hwpx"].includes(확장자)) {
        쪽지.textContent = "pdf, hwp, hwpx 파일만 올릴 수 있습니다.";
        return;
      }
      if (파일.size > 4 * 1024 * 1024) {
        쪽지.textContent = "파일이 너무 큽니다 (4MB까지). 나눠서 올려 주세요.";
        return;
      }

      const 버튼 = 폼.querySelector('button[type="submit"]');
      버튼.disabled = true;
      쪽지.textContent = "올리는 중…";
      try {
        const 주소 = "/api/files-admin?" + new URLSearchParams({
          act: "upload", 암호,
          title: 폼.title.value, subject: 폼.subject.value, kind: 폼.kind.value,
          filename: 파일.name,
        });
        const 응답 = await fetch(주소, {
          method: "POST",
          headers: { "Content-Type": "application/octet-stream" },
          body: 파일,
        });
        const 결과 = await 응답.json();
        if (!응답.ok) throw new Error(결과.오류 || "");

        파일들.unshift(결과);
        그리기();
        폼.reset();
        쪽지.textContent = "올렸습니다.";
      } catch (err) {
        쪽지.textContent = err.message || "올리지 못했습니다.";
      } finally {
        버튼.disabled = false;
      }
    });
  }

  /* ---------- 선생님: 암호 넣는 칸 ---------- */
  function 관리칸그리기() {
    if (암호) return 올리기폼그리기();
    관리칸.innerHTML = `<form class="fadmin-bar" id="관리로그인">
      <input type="password" placeholder="선생님 암호" autocomplete="current-password" />
      <button type="submit" class="btn btn-secondary">확인</button>
      <span class="caption"></span>
    </form>`;
    document.getElementById("관리로그인").onsubmit = async ev => {
      ev.preventDefault();
      const 칸 = ev.target.querySelector("input");
      const 쪽지 = ev.target.querySelector(".caption");
      쪽지.textContent = "확인 중…";
      const 응답 = await fetch("/api/admin", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ 암호: 칸.value, 작업: "확인" }),
      });
      if (응답.ok) {
        암호 = 칸.value;
        sessionStorage.setItem("수학을보다-암호", 암호);
        올리기폼그리기();
        그리기();
      } else {
        쪽지.textContent = "암호가 맞지 않습니다.";
      }
    };
  }

  if (location.search.includes("admin") || 암호) 관리칸그리기();

  불러오기();
}
</script>
