<script>
/* =========================================================
   ✏️ 파일을 올리는 법 — 두 단계입니다.

   1) 이 폴더 안의 'files' 폴더에 PDF 를 넣습니다.
      (GitHub 에서 files 폴더를 열고 Add file → Upload files)

   2) 아래 FILES 에 한 줄 추가합니다. 맨 위가 가장 최근입니다.

      date  : 올린 날짜 — "2026-08-06" 처럼
      subject: 과목 — 비워 두면 과목 표시가 안 나옵니다
      kind  : 학습지 / 정리 프린트 / 연습 문제 … 아무 말이나 됩니다
      title : 목록에 보일 이름
      href  : "files/파일이름.pdf"

   맨 앞의 // 를 지우면 아래 예시가 그대로 살아납니다.
   ========================================================= */
const FILES = [
  // { date: "2026-08-06", subject: "미적분Ⅰ", kind: "학습지",
  //   title: "미분계수 연습 20제", href: "files/미분계수-연습.pdf" },
];

/* ---------- 여기부터는 손대지 않아도 됩니다 ---------- */
{
  const 자리 = document.getElementById("fileList");

  if (!FILES.length) {
    /* 빈 목록에 줄만 그어 두면 고장 난 것처럼 보인다.
       (위 소개 문단이 '직접 보는 수학'을 이미 가리키므로 여기서는 반복하지 않는다) */
    자리.innerHTML = `<p class="empty">아직 올린 파일이 없습니다.</p>`;
  } else {
    자리.className = "filelist";
    자리.innerHTML = FILES.map(f => `
      <a href="${f.href}" download>
        <span class="caption filelist-date">${f.date}</span>
        <span class="filelist-main">
          <b>${f.title}</b>
          <span class="caption">${[f.subject, f.kind].filter(Boolean).join(" · ")}</span>
        </span>
        <span class="filelist-go" aria-hidden="true">내려받기 ↓</span>
      </a>`).join("");
  }
}
</script>
