     내용은 모두 assets/demos.js 에서 저절로 만들어집니다. -->
<section class="section" id="find">
  <div class="wrap">
    <div class="find">
      <h2 class="display-lg">뭘 찾고 있나요</h2>
      <p class="body-sm find-note">개념 이름을 치면 자료가 바로 나옵니다.</p>

      <div class="find-box">

             stroke-width="2" stroke-linecap="round">

        </svg>
        <input type="search" id="findQ" autocomplete="off" aria-label="자료 검색"
               aria-describedby="findCount" placeholder="예: 정사영, 삼각함수, 정규분포" />
      </div>

      <p class="caption find-count" id="findCount" role="status" aria-live="polite"></p>
      <div id="findOut"></div>
    </div>
  </div>
</section>

<!-- 자료 목록은 자료실(library.html)과 함께 쓰므로 따로 빼 두었습니다 -->
<script src="assets/demos.js"></script>

<script>
/* =========================================================
   1. 공지 — 여기에 한 항목씩 추가하면 화면에 올라갑니다.
      최신 것이 위로 오도록 맨 앞에 넣어 주세요.
      (자료 목록은 library.html, 질문·답은 ask.html 에 있습니다)
   ========================================================= */
const NOTICES = [
  { date: "2026-08-02", tag: "자료",
    title: "자료를 17개로 늘리고 2022 개정 교육과정에 맞췄습니다",
    body: "공통수학1·2, 대수, 미적분Ⅰ·Ⅱ, 확률과 통계, 기하 — 과목별로 정리했습니다. 카드에 과목과 영역이 적혀 있으니 진도에 맞는 것을 찾아 쓰세요." },

  { date: "2026-07-28", tag: "안내",
    title: "질문은 여기로 보내세요",
    body: "수업 시간에 묻기 애매한 것들을 편하게 남겨 주세요. 답은 이 페이지에 모아 둡니다." }
];

/* 접히는 한 줄로 보여 줍니다 — 맨 위 한 개는 늘 보이고, 나머지는 ＋ 를 누르면 나옵니다.
   공지가 하나도 없으면 줄 자체가 사라집니다 (빈 게시판이 남지 않게). */
{
  const strip = document.getElementById("notice");
  if (!NOTICES.length) {
    strip.remove();
  } else {
    const [first, ...rest] = NOTICES;
    document.getElementById("noticeHead").innerHTML =
      `<b>${first.title}</b> <span class="caption">${first.date}</span>`;
    document.getElementById("noticeRest").innerHTML = NOTICES.map(it => `
      <li>
        <span class="caption">${it.date} · ${it.tag}</span>
        <p class="body-sm" style="margin: 4px 0 0;"><b style="font-weight: 500;">${it.title}</b> — ${it.body}</p>
      </li>`).join("");
    if (!rest.length) strip.querySelector("summary").style.pointerEvents = "none";
    // 다른 페이지의 '공지' 메뉴로 들어오면 펼친 채로 보여 줍니다
    if (location.hash === "#notice") strip.open = true;
  }
}


/* =========================================================
   1-2. 홈 가운데 — 찾기

   자료 목록(assets/demos.js)을 그 자리에서 걸러 보여 줍니다.
   새 자료를 올리면 여기서도 바로 찾아집니다 — 손댈 것이 없습니다.

   비어 있을 때 과목을 보여 주는 이유: 빈 검색칸만 놓아 두면 무엇을
   칠 수 있는지 몰라 아무도 안 친다. 과목이 보이면 최소한 누를 것은 있다.
   ========================================================= */
{
  const 칸  = document.getElementById("findQ");
  const 결과 = document.getElementById("findOut");
  const 세기 = document.getElementById("findCount");
  const 열림 = DEMOS.filter(d => d.ready);

  const 최대 = 6;   // 홈이 길어지지 않게. 넘치면 '자료실에서 전부 보기'로 보냅니다

  // 검색칸이 비었을 때 — 과목 여섯 개
  function 과목들() {
    const order = Object.keys(SUBJECTS).filter(n => 열림.some(d => groupOf(d) === n));
    return `<nav class="subject-nav" aria-label="과목 바로가기">` + order.map(name => {
      const m = meta(name);
      const n = 열림.filter(d => groupOf(d) === name).length;
      return `<a href="library.html#${m.id}"><span class="dot" style="background:${m.color}"></span>` +
             `${name}<span class="n">${n}</span></a>`;
    }).join("") + `</nav>`;
  }

  function 줄(d) {
    const m = meta(groupOf(d));
    return `<a class="find-hit" href="${d.href}">
      <span class="find-fig" style="background:${m.color}">${d.fig}</span>
      <span class="find-text">
        <b>${d.title}</b>
        <span class="caption">${d.subject} · ${d.unit}</span>
      </span>
      <span class="find-go" aria-hidden="true">→</span>
    </a>`;
  }

  function 그리기() {
    const 말 = 칸.value.trim().toLowerCase();

    if (!말) {
      세기.textContent = "";
      결과.innerHTML = 과목들();
      return;
    }

    const 걸린것 = 열림.filter(d =>
      (d.title + d.subject + d.unit + d.desc + d.use + d.keywords + d.year)
        .toLowerCase().includes(말));

    if (!걸린것.length) {
      세기.textContent = "찾는 자료가 없습니다";
      결과.innerHTML =
        `<p class="find-none">아직 그 자료는 없습니다. ` +
        `<a href="ask.html">질문으로 남겨 주세요</a> — 보고 만들어 올리겠습니다.</p>`;
      return;
    }

    세기.textContent = `${걸린것.length}개 찾았습니다`;
    결과.innerHTML = 걸린것.slice(0, 최대).map(줄).join("") +
      (걸린것.length > 최대
        ? `<p class="find-more"><a class="go" href="library.html">자료실에서 전부 보기 →</a></p>`
        : "");
  }

  칸.addEventListener("input", 그리기);
  그리기();
}


/* =========================================================
   2. 히어로 그림 — 단위원 위의 점 P 가 돌면
      오른쪽 사인 곡선 위의 점이 같이 따라갑니다.
   ========================================================= */
const NS = "http://www.w3.org/2000/svg";
const art = document.getElementById("heroArt");

const CX = 150, CY = 170, R = 92;   // 단위원
const X0 = 268, XW = 232;           // 사인 곡선 한 주기가 그려지는 가로 구간

function node(name, attrs) {
  const n = document.createElementNS(NS, name);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}
const onCircle = th => [CX + R * Math.cos(th), CY - R * Math.sin(th)];
const onCurve  = th => [X0 + (th / (2 * Math.PI)) * XW, CY - R * Math.sin(th)];

// --- 한 번만 그리는 것들 (축 · 원 · 사인 곡선) ---
(function base() {
  const g = node("g", { fill: "none", stroke: "#000" });

  g.appendChild(node("line", { x1: 34, y1: CY, x2: 508, y2: CY, "stroke-opacity": 0.35 }));
  g.appendChild(node("line", { x1: CX, y1: 58, x2: CX, y2: 282, "stroke-opacity": 0.35 }));
  g.appendChild(node("line", { x1: X0, y1: 58, x2: X0, y2: 282, "stroke-opacity": 0.35 }));
  g.appendChild(node("circle", { cx: CX, cy: CY, r: R, "stroke-width": 1.6 }));

  let d = "";
  for (let i = 0; i <= 160; i++) {
    const th = (i / 160) * Math.PI * 2;
    const [x, y] = onCurve(th);
    d += (i ? " L" : "M") + x.toFixed(1) + "," + y.toFixed(1);
  }
  g.appendChild(node("path", { d, "stroke-width": 2 }));
  art.appendChild(g);
})();

// --- 각도에 따라 다시 그리는 것들 ---
const sector = node("path", { fill: "#d9f26e", stroke: "none" });
const radius = node("line", { stroke: "#000", "stroke-width": 1.6 });
const link   = node("line", { stroke: "#000", "stroke-opacity": 0.4, "stroke-dasharray": "5 4" });
const dotC   = node("circle", { r: 5, fill: "#000" });
const dotG   = node("circle", { r: 5, fill: "#000" });
const tag    = node("text", { "font-size": 15, "font-weight": 500, fill: "#000" });

art.insertBefore(sector, art.firstChild);   // 부채꼴은 선 아래로
art.append(radius, link, dotC, dotG, tag);

function drawArt(th) {
  const [px, py] = onCircle(th);
  const [qx, qy] = onCurve(th);

  sector.setAttribute("d",
    `M${CX},${CY} L${CX + R},${CY} A${R},${R} 0 ${th > Math.PI ? 1 : 0} 0 ${px},${py} Z`);

  radius.setAttribute("x1", CX); radius.setAttribute("y1", CY);
  radius.setAttribute("x2", px); radius.setAttribute("y2", py);

  link.setAttribute("x1", px); link.setAttribute("y1", py);
  link.setAttribute("x2", qx); link.setAttribute("y2", qy);

  dotC.setAttribute("cx", px); dotC.setAttribute("cy", py);
  dotG.setAttribute("cx", qx); dotG.setAttribute("cy", qy);

  const [tx, ty] = onCircle(th / 2);
  tag.setAttribute("x", CX + (tx - CX) * 0.42);
  tag.setAttribute("y", CY + (ty - CY) * 0.42 + 5);
  tag.textContent = "θ";
}

if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
  drawArt(Math.PI / 3);
} else {
  const t0 = performance.now();
  (function loop(t) {
    drawArt(((t - t0) / 15000 * Math.PI * 2) % (Math.PI * 2));
    requestAnimationFrame(loop);
  })(t0);
}
</script>
