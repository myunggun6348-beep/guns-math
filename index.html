<!-- ===================== 공지 한 줄 =====================
     히어로 바로 아래. '오늘 알아야 할 것'이 있으면 그것부터 보이고,
     없으면 줄 자체가 사라집니다.
     ✏️ 공지는 선생님 방(admin.html)에서 씁니다 — 여기는 손댈 것이 없습니다.

<div class="wrap">
  <details class="notice-strip" id="notice" hidden>
    <summary>
      <span class="label">공지</span>
      <span class="head" id="noticeHead"></span>
    </summary>
    <ul id="noticeRest"></ul>
  </details>
</div>

<!-- ===================== 요즘 올라온 것 =====================
     학생은 익명으로 묻기 때문에 "답 달렸어요" 하고 알려 줄 방법이 없습니다.
     그래서 학생이 다시 들어왔을 때 무엇이 새로 생겼는지 한눈에 보이는
     자리를 둡니다. 새 학습지와 새로 답한 질문을 날짜순으로 섞어 보여 주고,
     새로 생긴 게 하나도 없으면 이 줄 자체가 사라집니다. -->
<section class="section" id="fresh" hidden>
  <div class="wrap">
    <div class="fresh-head">
      <span class="fresh-badge">새 소식</span>
    </div>
    <div class="freshlist" id="freshList"></div>
  </div>
</section>

<!-- ===================== 찾기 =====================
     학생이 실제로 하는 질문은 결국 "그거 어디 있어요" 다.
     그 질문 하나를 홈 한가운데로 끌어올린 자리.

     세 곳을 한꺼번에 뒤집니다 — 어느 페이지에 있는지 학생이 미리
     알아야 할 이유가 없기 때문입니다.
       직접 보는 수학  ← assets/demos.js
       개념 지도       ← assets/concepts.js
       자료실          ← assets/files.js -->
<section class="section" id="find">
  <div class="wrap">
    <div class="find">
      <h2 class="display-lg">뭘 찾고 있나요</h2>
      <p class="body-sm find-note">개념 이름을 치면 자료·개념·학습지를 한꺼번에 찾습니다.</p>

      <div class="find-box">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7" /><line x1="16.5" y1="16.5" x2="21" y2="21" />
        </svg>
        <input type="search" id="findQ" autocomplete="off" aria-label="자료 검색"
               aria-describedby="findCount" placeholder="예: 정사영, 삼각함수, 정규분포" />
      </div>

      <p class="caption find-count" id="findCount" role="status" aria-live="polite"></p>
      <div id="findOut"></div>
    </div>
  </div>
</section>

<!-- 아래 셋은 각각 다른 페이지와 함께 쓰는 목록입니다. 홈은 셋을 한꺼번에 찾습니다. -->
<script src="assets/demos.js"></script>     <!-- 직접 보는 수학 (library.html) -->
<script src="assets/concepts.js"></script>  <!-- 개념 지도 (map.html) -->
<script src="assets/files.js"></script>     <!-- 자료실 (files.html) -->

<script>
/* =========================================================
   1. 공지 — 손대지 않아도 됩니다.

   예전에는 이 자리에 공지를 글로 박아 두었습니다. 한 줄 올리려면 코드를
   열어 고치고 다시 올려야 했고, 그래서 결국 아무도 안 올리게 됐습니다.
   이제 선생님 방(admin.html)에서 쓰면 여기로 곧장 들어옵니다.

   접히는 한 줄로 보여 줍니다 — 맨 위 한 개는 늘 보이고, 나머지는 ＋ 를
   누르면 나옵니다. 공지가 하나도 없으면 줄 자체가 사라집니다.
   ========================================================= */
{
  const strip = document.getElementById("notice");

  const 안전하게 = 글 => String(글 ?? "").replace(/[&<>"']/g, 기호 => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[기호]));

  function 그리기(목록) {
    if (!목록.length) { strip.remove(); return; }

    const [first, ...rest] = 목록;
    document.getElementById("noticeHead").innerHTML =
      `<b>${안전하게(first.title)}</b> <span class="caption">${안전하게(first.date)}</span>`;
    document.getElementById("noticeRest").innerHTML = 목록.map(it => `
      <li>
        <span class="caption">${안전하게(it.date)} · ${안전하게(it.tag)}</span>
        <p class="body-sm" style="margin: 4px 0 0;"><b style="font-weight: 500;">${안전하게(it.title)}</b>${
          it.body ? " — " + 안전하게(it.body) : ""}</p>
      </li>`).join("");

    if (!rest.length) strip.querySelector("summary").style.pointerEvents = "none";
    strip.hidden = false;
    // 다른 페이지의 '공지' 메뉴로 들어오면 펼친 채로 보여 줍니다
    if (location.hash === "#notice") strip.open = true;
  }

  /* 저장소가 아직 준비 안 됐거나(503) 실패하면 줄을 지웁니다 —
     비어 있는 공지 칸이 남아 있는 것보다 아예 없는 편이 낫습니다. */
  fetch("/api/notices")
    .then(응답 => (응답.ok ? 응답.json() : []))
    .then(목록 => 그리기(Array.isArray(목록) ? 목록 : []))
    .catch(() => strip.remove());
}


/* =========================================================
   1-2. 홈 가운데 — 찾기

   세 곳을 한꺼번에 뒤집니다. 학생은 자기가 찾는 것이 '자료'인지
   '개념'인지 '학습지'인지 미리 알 수 없으므로, 나눠서 찾게 하면 안 됩니다.
   대신 결과를 묶어서 어디로 가는 것인지 밝혀 둡니다.

     직접 보는 수학  ← DEMOS    (assets/demos.js)
     개념 지도       ← NODES    (assets/concepts.js)
     자료실          ← FILES    (assets/files.js)

   새 자료·개념·학습지를 추가하면 여기서도 바로 찾아집니다 — 손댈 것이 없습니다.

   비어 있을 때 과목을 보여 주는 이유: 빈 검색칸만 놓아 두면 무엇을
   칠 수 있는지 몰라 아무도 안 친다. 과목이 보이면 최소한 누를 것은 있다.
   ========================================================= */
{
  const 칸  = document.getElementById("findQ");
  const 결과 = document.getElementById("findOut");
  const 세기 = document.getElementById("findCount");

  // 자료실 파일은 이제 사이트 저장소(api/files.js)에 있어서, 여기서도
  // 따로 불러와야 검색에 걸립니다. 불러오기 전엔 FILES(항상 빈 배열)만
  // 쓰다가, 도착하면 합쳐서 다시 그립니다.
  let 동적파일 = [];
  fetch("/api/files").then(r => (r.ok ? r.json() : [])).then(list => {
    동적파일 = (Array.isArray(list) ? list : []).map(f => ({ ...f, href: f.url }));
    그리기();
  }).catch(() => {});
  const 열림 = DEMOS.filter(d => d.ready);

  /* 묶음마다 넷까지. 전체를 하나로 잘라 버리면 앞 묶음이 자리를 다 먹어
     뒤 묶음(개념·학습지)이 아예 안 보이는 일이 생긴다. */
  const 묶음최대 = 4;

  const 소문자 = (...조각) => 조각.filter(Boolean).join(" ").toLowerCase();

  /* --- 검색칸이 비었을 때 — 과목 여섯 개 --- */
  function 과목들() {
    const order = Object.keys(SUBJECTS).filter(n => 열림.some(d => groupOf(d) === n));
    return `<nav class="subject-nav" aria-label="과목 바로가기">` + order.map(name => {
      const m = meta(name);
      const n = 열림.filter(d => groupOf(d) === name).length;
      return `<a href="library.html#${m.id}"><span class="dot" style="background:${m.color}"></span>` +
             `${name}<span class="n">${n}</span></a>`;
    }).join("") + `</nav>`;
  }

  /* --- 결과 한 줄 ---
     그림칸에 들어갈 것: 자료는 제 그림, 개념·학습지는 아래 글리프.
     칸 크기를 똑같이 두는 것은 세 종류가 섞여도 줄이 안 흔들리게 하려는 것. */
  /* 개념그림은 SUBJECT_COLOR(고정 파스텔) 칩 위에 놓이므로 stroke 를 고정 검정으로 둔다.
     파일그림은 var(--surface-soft) 칩 위에 놓이는데 이건 어두운 화면에서 같이 어두워지므로
     stroke 를 currentColor 로 둬서 글자색을 따라가게 한다. */
  const 개념그림 = `<svg viewBox="0 0 88 48" fill="none" stroke="#000" stroke-width="1.6">
      <circle cx="20" cy="16" r="5"/><circle cx="20" cy="34" r="5"/><circle cx="66" cy="25" r="5"/>
      <path d="M25 18l36 6M25 32l36-6"/></svg>`;
  const 파일그림 = `<svg viewBox="0 0 88 48" fill="none" stroke="currentColor" stroke-width="1.6">
      <path d="M36 8h12l8 8v24H36z"/><path d="M48 8v8h8"/><path d="M40 26h12M40 32h12"/></svg>`;

  function 줄({ href, 색, 그림, 제목, 밑, 다운 }) {
    return `<a class="find-hit" href="${href}"${다운 ? " download" : ""}>
      <span class="find-fig" style="background:${색}">${그림}</span>
      <span class="find-text">
        <b>${제목}</b>
        <span class="caption">${밑}</span>
      </span>
      <span class="find-go" aria-hidden="true">${다운 ? "↓" : "→"}</span>
    </a>`;
  }

  /* --- 묶음 하나 그리기 --- */
  function 묶음(이름, 줄들, 더보기) {
    if (!줄들.length) return "";
    const 남은 = 줄들.length - 묶음최대;
    return `<div class="find-group">` +
      `<p class="find-group-head caption">${이름}<span>${줄들.length}</span></p>` +
      줄들.slice(0, 묶음최대).join("") +
      (남은 > 0 ? `<p class="find-more"><a class="go" href="${더보기}">${남은}개 더 보기 →</a></p>` : "") +
      `</div>`;
  }

  function 그리기() {
    const 말 = 칸.value.trim().toLowerCase();

    if (!말) {
      세기.textContent = "";
      결과.innerHTML = 과목들();
      return;
    }

    /* 1) 직접 보는 수학 */
    const 자료줄 = 열림
      .filter(d => 소문자(d.title, d.subject, d.unit, d.desc, d.use, d.keywords, d.year).includes(말))
      .map(d => {
        const m = meta(groupOf(d));
        return 줄({ href: d.href, 색: m.color, 그림: d.fig,
                   제목: d.title, 밑: `${d.subject} · ${d.unit}` });
      });

    /* 2) 개념 지도 — 개념 이름·설명뿐 아니라 그 개념에 매달린 자료 제목까지 본다.
          '정사영'으로 쳐도 그게 걸린 개념(공간도형)이 같이 나오도록. */
    const 개념줄 = Object.keys(NODES)
      .filter(id => {
        const n = NODES[id];
        return 소문자(n.name, n.subject, n.year, n.about,
                     n.demos.map(x => x.t).join(" ")).includes(말);
      })
      .map(id => {
        const n = NODES[id];
        const 개수 = n.demos.length;
        return 줄({ href: `map.html?n=${id}`,
                   색: SUBJECT_COLOR[n.subject] || "var(--surface-soft)",
                   그림: 개념그림, 제목: n.name,
                   밑: `${n.year} · ${n.subject}` +
                       (개수 ? ` · 자료 ${개수}개` : " · 자료 준비 중") });
      });

    /* 3) 자료실 (내려받는 파일) */
    const 파일줄 = [...(typeof FILES === "undefined" ? [] : FILES), ...동적파일]
      .filter(f => 소문자(f.title, f.subject, f.kind, f.keywords, f.date).includes(말))
      .map(f => 줄({ href: f.href, 색: "var(--surface-soft)", 그림: 파일그림,
                    제목: f.title, 다운: true,
                    밑: [f.subject, f.kind, f.date].filter(Boolean).join(" · ") }));

    const 합 = 자료줄.length + 개념줄.length + 파일줄.length;

    if (!합) {
      세기.textContent = "찾는 것이 없습니다";
      결과.innerHTML =
        `<p class="find-none">아직 그건 없습니다. ` +
        `<a href="ask.html">질문으로 남겨 주세요</a> — 보고 만들어 올리겠습니다.</p>`;
      return;
    }

    // 무엇이 몇 개인지 먼저 알려 준다 (화면낭독기도 이 줄을 읽습니다)
    세기.textContent = [
      자료줄.length && `자료 ${자료줄.length}개`,
      개념줄.length && `개념 ${개념줄.length}개`,
      파일줄.length && `학습지 ${파일줄.length}개`,
    ].filter(Boolean).join(" · ") + " 찾았습니다";

    결과.innerHTML =
      묶음("직접 보는 수학", 자료줄, "library.html") +
      묶음("개념 지도", 개념줄, "map.html") +
      묶음("자료실", 파일줄, "files.html");
  }

  칸.addEventListener("input", 그리기);
  그리기();
}


/* =========================================================
   1-3. 요즘 올라온 것

   질문은 익명이라 "답 달렸어요" 하고 알려 줄 수가 없습니다. 대신 학생이
   다시 들어왔을 때 새로 생긴 것이 눈에 띄게 해 둡니다.

   새 학습지(api/files)와 새로 답을 단 질문(api/questions 의 at)을 날짜순으로
   섞어 위에서부터 다섯 개까지. 새로 생긴 게 없으면 이 줄은 아예 안 나옵니다.
   ========================================================= */
{
  const 칸 = document.getElementById("fresh");
  const 자리 = document.getElementById("freshList");
  const 최대 = 5;
  const 새것기준일 = 14;   // 이 안에 올라온 것에는 NEW 를 붙입니다

  const 안전하게 = 글 => String(글 ?? "").replace(/[&<>"']/g, 기호 => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[기호]));

  const 며칠전 = 날짜 => Math.floor((Date.now() - new Date(날짜 + "T00:00:00")) / 86400000);
  const 날짜말 = 날짜 => {
    const d = 며칠전(날짜);
    if (d <= 0) return "오늘";
    if (d === 1) return "어제";
    if (d < 7) return d + "일 전";
    if (d < 30) return Math.floor(d / 7) + "주 전";
    return 날짜;
  };

  const 받기 = 주소 => fetch(주소).then(r => (r.ok ? r.json() : [])).catch(() => []);

  Promise.all([받기("/api/files"), 받기("/api/questions")]).then(([파일, 질문]) => {
    const 목록 = [];

    for (const f of Array.isArray(파일) ? 파일 : []) {
      if (!f.date) continue;
      목록.push({
        종류: "학습지", 날짜: f.date, 제목: f.title,
        밑: [f.subject, f.kind].filter(Boolean).join(" · "),
        href: f.url, 다운: true,
      });
    }
    // at 이 있는 것 = 선생님이 답을 단 질문
    for (const q of Array.isArray(질문) ? 질문 : []) {
      if (!q.at) continue;
      목록.push({
        종류: "답변", 날짜: q.at, 제목: q.q,
        밑: q.g ? q.g + " 학생 질문" : "학생 질문",
        href: "ask.html", 다운: false,
      });
    }

    if (!목록.length) return;               // 보여 줄 게 없으면 줄 자체를 숨긴 채로 둡니다

    목록.sort((a, b) => (a.날짜 < b.날짜 ? 1 : a.날짜 > b.날짜 ? -1 : 0));

    자리.innerHTML = 목록.slice(0, 최대).map(it => `
      <a class="fresh-hit" href="${안전하게(it.href)}"${it.다운 ? ' target="_blank" rel="noopener"' : ""}>
        <span class="fresh-kind fresh-${it.종류 === "학습지" ? "file" : "answer"}">${it.종류}</span>
        <span class="fresh-text">
          <b>${안전하게(it.제목)}</b>
          <span class="caption">${안전하게(it.밑)}</span>
        </span>
        <span class="fresh-when caption">
          ${며칠전(it.날짜) <= 새것기준일 ? '<span class="fresh-new">NEW</span>' : ""}
          ${안전하게(날짜말(it.날짜))}
        </span>
      </a>`).join("");

    칸.hidden = false;
  });
}


/* =========================================================
   2. 히어로 그림 — 단위원 위의 점 P 가 돌면
      오른쪽 사인 곡선 위의 점이 같이 따라갑니다.
   ========================================================= */
const NS = "http://www.w3.org/2000/svg";
const art = document.getElementById("heroArt");

const CX = 150, CY = 170, R = 92;   // 단위원
const X0 = 268, XW = 232;           // 사인 곡선 한 주기가 그려지는 가로 구간

function node(name, attrs) {
  const n = document.createElementNS(NS, name);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}
const onCircle = th => [CX + R * Math.cos(th), CY - R * Math.sin(th)];
const onCurve  = th => [X0 + (th / (2 * Math.PI)) * XW, CY - R * Math.sin(th)];

// --- 한 번만 그리는 것들 (축 · 원 · 사인 곡선) ---
// stroke/fill 을 currentColor 로 둔 것은 어두운 화면에서 글자색(흰색)을
// 그대로 따라가게 하려는 것. 연두 부채꼴만 색이 고정이라 그대로 둔다.
(function base() {
  const g = node("g", { fill: "none", stroke: "currentColor" });

  g.appendChild(node("line", { x1: 34, y1: CY, x2: 508, y2: CY, "stroke-opacity": 0.35 }));
  g.appendChild(node("line", { x1: CX, y1: 58, x2: CX, y2: 282, "stroke-opacity": 0.35 }));
  g.appendChild(node("line", { x1: X0, y1: 58, x2: X0, y2: 282, "stroke-opacity": 0.35 }));
  g.appendChild(node("circle", { cx: CX, cy: CY, r: R, "stroke-width": 1.6 }));

  let d = "";
  for (let i = 0; i <= 160; i++) {
    const th = (i / 160) * Math.PI * 2;
    const [x, y] = onCurve(th);
    d += (i ? " L" : "M") + x.toFixed(1) + "," + y.toFixed(1);
  }
  g.appendChild(node("path", { d, "stroke-width": 2 }));
  art.appendChild(g);
})();

// --- 각도에 따라 다시 그리는 것들 ---
const sector = node("path", { fill: "#d9f26e", stroke: "none" });
const radius = node("line", { stroke: "currentColor", "stroke-width": 1.6 });
const link   = node("line", { stroke: "currentColor", "stroke-opacity": 0.4, "stroke-dasharray": "5 4" });
const dotC   = node("circle", { r: 5, fill: "currentColor" });
const dotG   = node("circle", { r: 5, fill: "currentColor" });
const tag    = node("text", { "font-size": 15, "font-weight": 500, fill: "currentColor" });

art.insertBefore(sector, art.firstChild);   // 부채꼴은 선 아래로
art.append(radius, link, dotC, dotG, tag);

function drawArt(th) {
  const [px, py] = onCircle(th);
  const [qx, qy] = onCurve(th);

  sector.setAttribute("d",
    `M${CX},${CY} L${CX + R},${CY} A${R},${R} 0 ${th > Math.PI ? 1 : 0} 0 ${px},${py} Z`);

  radius.setAttribute("x1", CX); radius.setAttribute("y1", CY);
  radius.setAttribute("x2", px); radius.setAttribute("y2", py);

  link.setAttribute("x1", px); link.setAttribute("y1", py);
  link.setAttribute("x2", qx); link.setAttribute("y2", qy);

  dotC.setAttribute("cx", px); dotC.setAttribute("cy", py);
  dotG.setAttribute("cx", qx); dotG.setAttribute("cy", qy);

  const [tx, ty] = onCircle(th / 2);
  tag.setAttribute("x", CX + (tx - CX) * 0.42);
  tag.setAttribute("y", CY + (ty - CY) * 0.42 + 5);
  tag.textContent = "θ";
}

if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
  drawArt(Math.PI / 3);
} else {
  const t0 = performance.now();
  (function loop(t) {
    drawArt(((t - t0) / 15000 * Math.PI * 2) % (Math.PI * 2));
    requestAnimationFrame(loop);
  })(t0);
}
</script>
