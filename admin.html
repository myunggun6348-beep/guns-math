<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="assets/theme.js"></script>
<title>선생님 방 · 수학을 보다</title>

<!-- 검색엔진에 잡히지 않게 합니다. 학생이 검색하다 흘러들어올 이유가 없습니다.
     (물론 진짜 잠금은 암호입니다 — 이건 '눈에 안 띄게' 하는 것뿐입니다) -->
<meta name="robots" content="noindex, nofollow" />

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='13.5' cy='13.5' r='9' fill='%23d9f26e'/%3E%3Cpath d='M6 16q3.75-8 7.5-2.5t7.5-2.5' fill='none' stroke='%23000' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='13.5' cy='13.5' r='9' fill='none' stroke='%23000' stroke-width='2.5'/%3E%3Cpath d='M20 20l7.5 7.5' stroke='%23000' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />

<!-- 폰 홈 화면에 '선생님 방' 앱으로 올릴 수 있게 합니다.
     아이폰은 홈 화면에 올린 것에서만 알림을 받을 수 있어서 필요합니다.
     학생 페이지에는 넣지 않습니다 (홈 화면 앱이 선생님 방으로 열리므로). -->
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/assets/icon-192.png" />
<meta name="apple-mobile-web-app-title" content="선생님 방" />
<meta name="theme-color" content="#f8f1e3" />

<link rel="stylesheet" href="assets/vendor/fonts/pretendard.css" />
<link rel="stylesheet" href="assets/vendor/fonts/jetbrains-mono.css" />
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>

<!-- ===================== 상단 내비 =====================
     학생용 메뉴(공지·자료·질문)는 여기 두지 않습니다. 이 페이지에서 할 일은
     '답 달기'와 '자료 올리기' 둘뿐이라, 나갈 문 하나만 있으면 됩니다. -->
<header class="nav">
  <div class="wrap">
    <a class="brand" href="index.html">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="13.5" cy="13.5" r="9" fill="#d9f26e" />
        <path d="M6 16q3.75-8 7.5-2.5t7.5-2.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        <circle cx="13.5" cy="13.5" r="9" fill="none" stroke="currentColor" stroke-width="2.5" />
        <path d="M20 20l7.5 7.5" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
      </svg>
      수학을 보다
    </a>
    <div class="nav-links">
      <a href="index.html">사이트 보기 →</a>
    </div>
    <div class="nav-right">
      <button type="button" id="themeToggle" class="theme-toggle" aria-pressed="false" aria-label="어두운 화면으로 보기">
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" /></svg>
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
      </button>
    </div>
  </div>
</header>

<section class="section" style="padding-top: var(--xxl);">
  <div class="wrap">

    <!-- ---------- 암호 넣기 (들어오면 이것만 보입니다) ---------- -->
    <div id="문앞">
      <span class="eyebrow">Admin</span>
      <h1 class="display-lg">선생님 방</h1>
      <p class="body-lg" style="margin-top: var(--md); max-width: 30em;">
        암호를 넣으면 질문에 답을 달고, 자료실에 파일을 올릴 수 있습니다.
      </p>
      <form class="adm-login" id="로그인">
        <input type="password" placeholder="암호" autocomplete="current-password" required />
        <button type="submit" class="btn btn-primary">들어가기 →</button>
        <!-- 알림 메일을 폰으로 받고 바로 답하려면 암호를 매번 치는 게 제일 번거롭습니다.
             대신 여러 사람이 쓰는 학교 컴퓨터에서는 켜면 안 되니 기본은 꺼 둡니다. -->
        <label class="adm-remember">
          <input type="checkbox" id="암호기억" />
          <span>이 기기에서 기억하기 — 내 폰·내 컴퓨터에서만 켜세요</span>
        </label>
        <p class="caption adm-status" role="status" aria-live="polite"></p>
      </form>
    </div>

    <!-- ---------- 들어온 다음 (암호를 맞혀야 보입니다) ---------- -->
    <div id="안쪽" hidden>
      <div class="adm-top">
        <div>
          <span class="eyebrow">Admin</span>
          <h1 class="display-lg">선생님 방</h1>
        </div>
        <div class="adm-top-tools">
          <!-- 저장소가 사라져도 글이 남도록, 질문·답과 자료 목록을
               파일 하나로 내려받아 둘 수 있습니다 -->
          <button type="button" id="내려받기">전부 내보내기</button>
          <button type="button" id="나가기">나가기</button>
        </div>
      </div>

      <!-- ===== 질문 =====
           맨 위에 둡니다. 공지·자료는 선생님이 시간 날 때 하는 일이지만,
           질문은 학생이 답을 기다리고 있는 일이라서요. 예전에는 맨 아래에
           있어서 36일 동안 답을 못 받은 질문이 생겼습니다. -->
      <section class="adm-block">
        <h2 class="display-sm">받은 질문</h2>
        <!-- 답을 기다리는 질문이 몇 개인지 — 들어오자마자 보이게 -->
        <p class="adm-waiting" id="질문요약" role="status" aria-live="polite"></p>

        <!-- 새 질문 알림 — 메일함을 확인하지 않아도 폰에 바로 뜹니다.
             기기마다 따로 켭니다 (폰에서 켜면 폰으로, 컴퓨터에서 켜면 컴퓨터로). -->
        <div class="adm-notify" id="알림칸">
          <span class="adm-notify-text" id="알림글">알림 상태를 확인하는 중…</span>
          <span class="adm-notify-tools">
            <button type="button" class="btn btn-primary" id="알림켜기" hidden>이 기기에서 알림 받기</button>
            <button type="button" class="adm-del" id="알림시험" hidden>시험 알림 보내기</button>
            <button type="button" class="adm-del" id="알림끄기" hidden>이 기기 알림 끄기</button>
          </span>
        </div>

        <div id="질문목록"></div>

        <!-- 평소엔 학생이 쓰는 즉시 공개됩니다. 시험 기간처럼 몰릴 때만
             이 스위치를 켜 두면 선생님이 본 것만 올라갑니다. -->
        <label class="adm-switch">
          <input type="checkbox" id="검토스위치" />
          <span>확인 후 공개 — 켜 두면 내가 공개를 누른 질문만 학생에게 보입니다</span>
        </label>
      </section>

      <!-- ===== 공지 =====
           예전에는 index.html 안에 글로 박혀 있어서 한 줄 올리려면 코드를
           고쳐야 했습니다. 여기서 쓰면 홈 맨 위 공지 줄에 바로 올라갑니다. -->
      <section class="adm-block">
        <h2 class="display-sm">공지</h2>
        <p class="body-sm adm-note">
          쓰면 홈 맨 위에 바로 올라갑니다. 맨 위 한 개는 늘 펼쳐져 보이고
          나머지는 ＋ 를 눌러야 나오니, 제일 중요한 것을 마지막에 쓰세요.
        </p>

        <form class="adm-upload" id="공지쓰기">
          <div class="adm-row">
            <input type="text" name="구분" placeholder="구분 (예: 안내)" list="공지구분" />
            <input type="text" name="제목" placeholder="제목 (예: 9월 모평 대비 학습지 올렸습니다)" required />
          </div>
          <datalist id="공지구분">
            <option value="안내"></option>
            <option value="자료"></option>
            <option value="시험"></option>
            <option value="수업"></option>
          </datalist>
          <div class="adm-row">
            <textarea name="내용" rows="3" placeholder="자세한 내용 (안 써도 됩니다)"></textarea>
          </div>
          <div class="adm-row">
            <button type="submit" class="btn btn-primary">공지 올리기</button>
            <span class="caption adm-status" role="status" aria-live="polite"></span>
          </div>
        </form>

        <div id="공지목록"></div>
      </section>

      <!-- ===== 자료실 ===== -->
      <section class="adm-block">
        <h2 class="display-sm">자료실</h2>
        <p class="body-sm adm-note">
          pdf · hwp · hwpx 파일을 올릴 수 있습니다. 하나에 50MB까지입니다.
          올리는 즉시 자료실과 홈 검색에 나타납니다.
        </p>

        <form class="adm-upload" id="파일올리기">
          <div class="adm-row">
            <input type="text" name="title" placeholder="제목 (예: 미분계수 연습 20제)" required />
            <input type="text" name="subject" placeholder="과목 (예: 미적분Ⅰ)" />
            <input type="text" name="kind" placeholder="종류 (예: 학습지)" />
          </div>
          <div class="adm-row">
            <!-- 개념을 골라 두면 개념 지도에서 그 개념을 눌렀을 때 이 학습지가
                 같이 나옵니다. 목록은 assets/concepts.js 에서 자동으로 만듭니다. -->
            <select name="concept" class="adm-concept"></select>
          </div>
          <div class="adm-row">
            <input type="file" name="file" accept=".pdf,.hwp,.hwpx" required />
            <button type="submit" class="btn btn-primary">올리기 ↑</button>
          </div>
          <p class="caption adm-status" role="status" aria-live="polite"></p>
        </form>

        <div id="파일목록"></div>
      </section>

    </div>

  </div>
</section>

<footer class="footer">
  <div class="wrap">
    <p class="footer-base body-sm">선생님 전용 페이지입니다.</p>
  </div>
</footer>

<!-- 개념 목록 — 자료를 올릴 때 '어느 개념인지' 고르는 칸을 여기서 만듭니다 -->
<script src="assets/concepts.js"></script>

<script>
/* =========================================================
   선생님 방 — 손대지 않아도 됩니다.

   질문에 답을 달고 자료를 올리는 일을 여기 한곳에 모아 뒀습니다.
   학생이 보는 페이지(ask.html · files.html)에는 이런 칸이 아예 없습니다.

   암호는 Vercel 에 넣어 둔 ADMIN_PASSWORD 입니다. 이 파일에는 암호가
   들어 있지 않아서, 코드가 공개돼도 암호는 새지 않습니다.
   ========================================================= */
{
  const 문앞 = document.getElementById("문앞");
  const 안쪽 = document.getElementById("안쪽");
  const 로그인 = document.getElementById("로그인");
  const 질문목록 = document.getElementById("질문목록");
  const 파일목록 = document.getElementById("파일목록");
  const 올리기 = document.getElementById("파일올리기");
  const 공지목록 = document.getElementById("공지목록");
  const 공지쓰기 = document.getElementById("공지쓰기");

  /* 암호 보관 — 두 가지입니다.
       기본(sessionStorage) : 창을 닫으면 지워집니다. 학교 공용 컴퓨터용.
       '이 기기에서 기억하기'(localStorage) : 창을 닫아도 남습니다. 내 폰용 —
         알림 메일을 받고 링크를 눌렀을 때 암호를 또 치지 않아도 됩니다.
     '나가기'를 누르면 둘 다 지웁니다. 브라우저가 저장소를 막아 두면(사생활 보호
     모드 등) 읽고 쓸 때 오류가 나므로 try 로 감쌉니다 — 그때는 매번 칩니다. */
  const 암호열쇠 = "수학을보다-암호";
  const 보관함읽기 = 함 => { try { return 함.getItem(암호열쇠) || ""; } catch { return ""; } };
  const 보관함지우기 = () => {
    try { localStorage.removeItem(암호열쇠); } catch {}
    try { sessionStorage.removeItem(암호열쇠); } catch {}
  };
  let 암호 = 보관함읽기(localStorage) || 보관함읽기(sessionStorage);
  let 질문들 = [];
  let 파일들 = [];
  let 공지들 = [];

  /* 학생이 쓴 글을 그대로 화면에 박으면 <script> 같은 걸 적어 넣었을 때
     그게 코드로 실행돼 버립니다. 꺾쇠 같은 기호를 '글자'로 바꿔서 막습니다. */
  const 안전하게 = 글 => String(글 ?? "").replace(/[&<>"']/g, 기호 => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[기호]));

  const 크기표시 = 바이트 => {
    if (!바이트) return "";
    const kb = 바이트 / 1024;
    return kb < 1024 ? `${Math.round(kb)}KB` : `${(kb / 1024).toFixed(1)}MB`;
  };

  /* ---------- 개념 고르는 칸 ----------
     개념 지도(assets/concepts.js)에 있는 개념을 학년·과목으로 묶어 보여 줍니다.
     여기서 고른 개념이 지도에서 이 학습지를 불러 주는 열쇠가 됩니다. */
  const 개념이름 = id => (typeof NODES !== "undefined" && NODES[id] ? NODES[id].name : "");

  function 개념칸채우기(칸, 고른것 = "") {
    if (typeof NODES === "undefined") { 칸.hidden = true; return; }
    const 묶음 = {};
    for (const [id, n] of Object.entries(NODES)) {
      (묶음[`${n.year} · ${n.subject}`] ||= []).push([id, n.name]);
    }
    칸.innerHTML =
      `<option value="">개념 연결 안 함 (자료실에만 두기)</option>` +
      Object.entries(묶음).map(([제목, 것들]) =>
        `<optgroup label="${제목}">` +
        것들.map(([id, 이름]) =>
          `<option value="${안전하게(id)}"${id === 고른것 ? " selected" : ""}>${안전하게(이름)}</option>`
        ).join("") + `</optgroup>`
      ).join("");
  }

  /* ---------- 공지 ----------
     질문과 달리 선생님이 직접 쓰는 글이라 검토 절차가 없습니다.
     저장하면 홈 맨 위 공지 줄에 곧바로 올라갑니다. */
  let 공지수정중 = null;   // 지금 고치고 있는 공지의 id (한 번에 하나만)

  function 공지그리기() {
    if (!공지들.length) {
      공지목록.innerHTML = `<p class="empty">아직 올린 공지가 없습니다.</p>`;
      return;
    }
    공지목록.innerHTML = `<div class="filelist">` + 공지들.map(n => {
      if (n.id === 공지수정중) {
        return `
      <div class="filelist-row adm-edit-row" data-id="${안전하게(n.id)}">
        <div class="adm-row">
          <input type="text" class="adm-edit-tag" placeholder="구분" value="${안전하게(n.tag)}" />
          <input type="text" class="adm-edit-title" placeholder="제목" value="${안전하게(n.title)}" required />
        </div>
        <div class="adm-row">
          <textarea class="adm-edit-body" rows="3" placeholder="자세한 내용">${안전하게(n.body)}</textarea>
        </div>
        <div class="adm-row">
          <button type="button" class="btn btn-primary" data-act="저장">저장</button>
          <button type="button" class="adm-del" data-act="취소">취소</button>
          <span class="caption adm-status"></span>
        </div>
      </div>`;
      }
      return `
      <div class="filelist-row">
        <a href="/#notice" target="_blank" rel="noopener">
          <span class="caption filelist-date">${안전하게(n.date)}</span>
          <span class="filelist-main">
            <b>${안전하게(n.title)}</b>
            <span class="caption">${[n.tag, n.body].filter(Boolean).map(안전하게).join(" · ")}</span>
          </span>
          <span class="filelist-go" aria-hidden="true">홈에서 보기 ↗</span>
        </a>
        <button type="button" class="adm-del" data-act="수정" data-id="${안전하게(n.id)}">수정</button>
        <button type="button" class="adm-del" data-act="삭제" data-id="${안전하게(n.id)}">지우기</button>
      </div>`;
    }).join("") + `</div>`;
  }

  async function 공지불러오기() {
    try {
      const 응답 = await fetch("/api/admin", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ 암호, 작업: "공지목록" }),
      });
      if (응답.status === 503) {
        공지목록.innerHTML = `<p class="empty">공지 저장소를 준비하고 있습니다.</p>`;
        return;
      }
      const 결과 = await 응답.json();
      if (!응답.ok) throw new Error();
      공지들 = 결과.목록 || [];
      공지그리기();
    } catch {
      공지목록.innerHTML = `<p class="empty">공지를 불러오지 못했습니다.</p>`;
    }
  }

  공지쓰기.addEventListener("submit", async e => {
    e.preventDefault();
    const 쪽지 = 공지쓰기.querySelector(".adm-status");
    const 제목 = 공지쓰기.제목.value.trim();
    if (!제목) { 쪽지.textContent = "제목을 입력해 주세요."; return; }

    const 버튼 = 공지쓰기.querySelector('button[type="submit"]');
    버튼.disabled = true;
    쪽지.textContent = "올리는 중…";
    try {
      const 응답 = await fetch("/api/admin", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          암호, 작업: "공지쓰기",
          구분: 공지쓰기.구분.value.trim(),
          제목,
          내용: 공지쓰기.내용.value.trim(),
        }),
      });
      const 결과 = await 응답.json();
      if (!응답.ok) throw new Error(결과.오류 || "");
      공지들.unshift(결과);
      공지그리기();
      공지쓰기.reset();
      쪽지.textContent = "올렸습니다. 홈 맨 위에 보입니다.";
    } catch (err) {
      쪽지.textContent = err.message || "올리지 못했습니다.";
    } finally {
      버튼.disabled = false;
    }
  });

  공지목록.addEventListener("click", async e => {
    const 버튼 = e.target.closest("[data-act]");
    if (!버튼) return;
    const 작업 = 버튼.dataset.act;

    if (작업 === "수정") { 공지수정중 = 버튼.dataset.id; 공지그리기(); return; }
    if (작업 === "취소") { 공지수정중 = null; 공지그리기(); return; }

    if (작업 === "삭제") {
      if (!confirm("이 공지를 지울까요? 되돌릴 수 없습니다.")) return;
      버튼.disabled = true;
      try {
        const 응답 = await fetch("/api/admin", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ 암호, 작업: "공지지우기", 공지id: 버튼.dataset.id }),
        });
        const 결과 = await 응답.json();
        if (!응답.ok) throw new Error(결과.오류 || "");
        공지들 = 공지들.filter(n => n.id !== 버튼.dataset.id);
        공지그리기();
      } catch (err) {
        alert(err.message || "지우지 못했습니다.");
        버튼.disabled = false;
      }
      return;
    }

    if (작업 === "저장") {
      const 줄 = 버튼.closest(".adm-edit-row");
      const id = 줄.dataset.id;
      const 쪽지 = 줄.querySelector(".adm-status");
      const 제목 = 줄.querySelector(".adm-edit-title").value.trim();
      if (!제목) { 쪽지.textContent = "제목을 입력해 주세요."; return; }

      버튼.disabled = true;
      쪽지.textContent = "저장하는 중…";
      try {
        const 응답 = await fetch("/api/admin", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            암호, 작업: "공지고치기", 공지id: id,
            구분: 줄.querySelector(".adm-edit-tag").value.trim(),
            제목,
            내용: 줄.querySelector(".adm-edit-body").value.trim(),
          }),
        });
        const 결과 = await 응답.json();
        if (!응답.ok) throw new Error(결과.오류 || "");
        공지들 = 공지들.map(n => (n.id === id ? 결과 : n));
        공지수정중 = null;
        공지그리기();
      } catch (err) {
        쪽지.textContent = err.message || "저장하지 못했습니다.";
        버튼.disabled = false;
      }
    }
  });

  /* ---------- 질문 ----------
     '답을 기다리는 질문'과 '답한 질문'을 갈라 둡니다. 예전에는 한 줄로 섞여
     있어서, 질문이 쌓이면 답 안 한 것이 답한 것들 사이에 묻혔습니다.

     기다리는 질문은 오래된 것부터 — 가장 오래 기다린 학생이 맨 위입니다.
     답한 질문은 접어 두고, 펼치면 최신 것부터 보입니다. */
  const 질문요약 = document.getElementById("질문요약");
  const 원래제목 = document.title;
  let 방금한일 = "";          // '답을 올렸습니다' 같은 한마디 (다음 그리기 때 한 번 보임)
  let 메일에서왔나 = true;    // 주소 끝 #q-번호 로 들어왔으면 그 질문으로 한 번만 데려갑니다

  // 답을 안 했거나, 했어도 아직 학생에게 안 보이는 것 — 둘 다 선생님 손이 필요합니다
  const 기다리나 = it => !it.a || it.h;

  const 며칠째 = 날짜 => Math.max(0, Math.floor((Date.now() - new Date(날짜 + "T00:00:00")) / 86400000));
  const 기다린말 = 날짜 => {
    const d = 며칠째(날짜);
    return d === 0 ? "오늘 들어옴" : d === 1 ? "어제 들어옴" : `${d}일째 기다림`;
  };

  function 질문한건(it) {
    const 기다림 = 기다리나(it);
    return `
      <article class="adm-q${it.h ? " adm-q-wait" : ""}" id="q-${안전하게(it.id)}" data-id="${안전하게(it.id)}">
        <p class="caption">${안전하게(it.t)}${it.g ? " · " + 안전하게(it.g) : ""}${
          기다림 && !it.a ? ` · <b class="adm-days">${기다린말(it.t)}</b>` : ""}${
          it.h ? ` <span class="adm-badge">학생에게 안 보임</span>` : ""}</p>
        <p class="adm-q-text">${안전하게(it.q)}</p>
        <textarea rows="3" placeholder="답을 쓰고 저장을 누르세요 (Ctrl+Enter 로도 저장됩니다)">${안전하게(it.a)}</textarea>
        <div class="adm-row">
          <button type="button" class="btn btn-primary" data-act="답변">${it.a ? "답 고치기" : "답 올리기"}</button>
          ${it.h ? `<button type="button" class="btn btn-secondary" data-act="공개">공개하기</button>` : ""}
          <button type="button" class="adm-del" data-act="삭제">지우기</button>
          <span class="caption adm-status"></span>
        </div>
      </article>`;
  }

  function 질문그리기() {
    /* 다시 그리면 textarea 가 새로 만들어져서, 다른 칸에 쓰다 만 답이
       사라집니다. 그리기 전에 쓰던 글을 번호별로 챙겨 두었다가 되돌립니다. */
    const 쓰던글 = {};
    질문목록.querySelectorAll("article").forEach(글 => {
      const 칸 = 글.querySelector("textarea");
      if (칸 && 칸.value !== 칸.defaultValue) 쓰던글[글.dataset.id] = 칸.value;
    });
    const 펼쳐둠 = document.getElementById("답한질문")?.open || false;

    const 기다림 = 질문들.filter(기다리나).sort((a, b) => Number(a.id) - Number(b.id));
    const 답함 = 질문들.filter(it => !기다리나(it)).sort((a, b) => Number(b.id) - Number(a.id));

    // 맨 위 한 줄 요약 + 탭 제목에 숫자 (창을 켜 둔 채 다른 일을 해도 보이게)
    const 가장오래 = 기다림.length ? 며칠째(기다림[0].t) : 0;
    질문요약.className = "adm-waiting" + (기다림.length ? " on" : "");
    질문요약.textContent = (방금한일 ? 방금한일 + " " : "") + (기다림.length
      ? `답을 기다리는 질문 ${기다림.length}개` + (가장오래 >= 2 ? ` · 가장 오래된 것 ${가장오래}일째` : "")
      : "답을 기다리는 질문이 없습니다.");
    방금한일 = "";
    document.title = 기다림.length ? `(${기다림.length}) ${원래제목}` : 원래제목;

    if (!질문들.length) {
      질문목록.innerHTML = `<p class="empty">아직 들어온 질문이 없습니다.</p>`;
      return;
    }

    질문목록.innerHTML =
      기다림.map(질문한건).join("") +
      (답함.length
        ? `<details class="adm-done" id="답한질문"${펼쳐둠 ? " open" : ""}>
             <summary>답한 질문 ${답함.length}개 보기</summary>
             ${답함.map(질문한건).join("")}
           </details>`
        : "");

    for (const [id, 글] of Object.entries(쓰던글)) {
      const 칸 = 질문목록.querySelector(`article[data-id="${CSS.escape(id)}"] textarea`);
      if (칸) 칸.value = 글;
    }

    /* 알림 메일의 '답하러 가기' 링크는 admin.html#q-번호 로 옵니다.
       그 질문을 화면 가운데로 가져오고 답 칸에 바로 커서를 둡니다. */
    if (메일에서왔나) {
      메일에서왔나 = false;
      const 찾는것 = location.hash.startsWith("#q-") ? location.hash.slice(3) : "";
      const 글 = 찾는것 && 질문목록.querySelector(`article[data-id="${CSS.escape(찾는것)}"]`);
      if (글) {
        const 접힌곳 = 글.closest("details");
        if (접힌곳) 접힌곳.open = true;
        글.classList.add("adm-q-here");
        글.scrollIntoView({ block: "center" });
        글.querySelector("textarea").focus({ preventScroll: true });
      } else if (찾는것) {
        질문요약.textContent = "메일에 적힌 질문을 찾지 못했습니다 (이미 지웠을 수 있습니다). " + 질문요약.textContent;
      }
    }
  }

  /* 선생님 방을 켜 둔 채 다른 알림 메일의 링크를 누르면, 브라우저가 페이지를
     새로 열지 않고 주소 끝(#q-번호)만 바꿀 때가 있습니다. 그때도 그 질문으로
     데려가도록 목록을 새로 받아 옵니다 (그사이 들어온 새 질문일 수 있으니까). */
  window.addEventListener("hashchange", () => {
    if (!location.hash.startsWith("#q-") || 안쪽.hidden) return;
    메일에서왔나 = true;
    질문불러오기();
  });

  /* ---------- 새 질문 알림 (웹 푸시) ----------
     메일은 스팸함으로 가거나 안 올 때가 있고, 확인하려면 메일함을 따로 열어야
     했습니다. 이제 선생님 방에서 '이 기기에서 알림 받기'를 한 번 누르면
     새 질문이 올 때 그 기기에 바로 알림이 뜨고, 누르면 답 칸이 열립니다.

     기기마다 따로 켭니다. 서버 쪽 설명은 api/_push.js, 알림을 띄우는 일꾼은
     sw.js 에 있습니다. 필요한 열쇠는 서버가 알아서 만듭니다 (설정할 것 없음). */
  const 알림글 = document.getElementById("알림글");
  const 알림켜기단추 = document.getElementById("알림켜기");
  const 알림시험단추 = document.getElementById("알림시험");
  const 알림끄기단추 = document.getElementById("알림끄기");
  let 공개열쇠 = "";

  const 아이폰인가 = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);   // 요즘 아이패드는 맥인 척합니다
  const 홈화면앱인가 = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  const 푸시되나 = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;

  const 기기설명 = () => {
    const ua = navigator.userAgent;
    if (/Android/.test(ua)) return "안드로이드";
    if (/iPhone|iPod/.test(ua)) return "아이폰";
    if (/iPad/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)) return "아이패드";
    if (/Windows/.test(ua)) return "윈도우 컴퓨터";
    if (/Mac/.test(ua)) return "맥";
    return "기타 기기";
  };

  // 서버가 주는 공개 열쇠(글자)를 브라우저가 원하는 모양(바이트)으로 바꿉니다
  const 열쇠바이트 = 글 => {
    const 채움 = "=".repeat((4 - (글.length % 4)) % 4);
    const 원본 = atob((글 + 채움).replace(/-/g, "+").replace(/_/g, "/"));
    return Uint8Array.from(원본, 글자 => 글자.charCodeAt(0));
  };

  const 관리요청 = async 몸 => {
    const 응답 = await fetch("/api/admin", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ 암호, ...몸 }),
    });
    const 결과 = await 응답.json().catch(() => ({}));
    if (!응답.ok) throw new Error(결과.오류 || "알림 설정을 바꾸지 못했습니다.");
    return 결과;
  };

  async function 이기기구독() {
    const 등록 = await navigator.serviceWorker.getRegistration("/");
    return 등록 ? 등록.pushManager.getSubscription() : null;
  }

  function 알림칸그리기({ 켜짐, 기기수 = 0, 안내 = "" }) {
    알림켜기단추.hidden = 켜짐;
    알림끄기단추.hidden = !켜짐;
    알림시험단추.hidden = 기기수 === 0;
    document.getElementById("알림칸").classList.toggle("on", 켜짐);
    알림글.textContent = 안내 || (켜짐
      ? `이 기기로 새 질문 알림이 옵니다.${기기수 > 1 ? ` (알림 받는 기기 ${기기수}대)` : ""}`
      : `새 질문이 오면 이 기기로 알림을 받을 수 있습니다 — 내 폰·내 컴퓨터에서만 켜세요.${
          기기수 ? ` (지금 다른 기기 ${기기수}대가 받는 중)` : ""}`);
  }

  async function 알림상태확인() {
    // 이 브라우저로는 아예 못 받는 경우 — 무엇을 하면 되는지 알려 줍니다
    if (!푸시되나) {
      알림켜기단추.hidden = 알림끄기단추.hidden = 알림시험단추.hidden = true;
      알림글.textContent = 아이폰인가 && !홈화면앱인가
        ? "아이폰은 홈 화면에 올린 '선생님 방'에서만 알림을 받습니다. Safari 아래쪽 공유 단추(□↑) → '홈 화면에 추가' → 새로 생긴 아이콘으로 열어서 여기서 켜세요."
        : "이 브라우저로는 알림을 받을 수 없습니다. 크롬·엣지·삼성 인터넷으로 열어 주세요.";
      return;
    }
    try {
      const 구독 = await 이기기구독();
      const 상태 = await 관리요청({ 작업: "알림상태", 구독: 구독 ? 구독.toJSON() : null });
      공개열쇠 = 상태.공개열쇠;

      if (Notification.permission === "denied") {
        return 알림칸그리기({ 켜짐: false, 기기수: 상태.기기수,
          안내: "이 기기에서 이 사이트의 알림이 막혀 있습니다. 주소창 왼쪽 자물쇠(또는 브라우저 설정 → 사이트 권한)에서 알림을 '허용'으로 바꾼 뒤 새로고침하세요." });
      }
      /* 이 기기는 받게 되어 있는데 서버 목록에서만 빠진 경우(예: 저장소를
         옮겼거나 한동안 실패해서 지워짐) — 조용히 다시 올려 둡니다. */
      if (구독 && Notification.permission === "granted" && !상태.이기기) {
        const 다시 = await 관리요청({ 작업: "알림켜기", 구독: 구독.toJSON(), 기기: 기기설명() });
        return 알림칸그리기({ 켜짐: true, 기기수: 다시.기기수 });
      }
      알림칸그리기({ 켜짐: Boolean(구독 && 상태.이기기), 기기수: 상태.기기수 });
    } catch (err) {
      알림켜기단추.hidden = 알림끄기단추.hidden = 알림시험단추.hidden = true;
      알림글.textContent = "알림 상태를 확인하지 못했습니다. 잠시 뒤 새로고침해 주세요.";
    }
  }

  알림켜기단추.addEventListener("click", async () => {
    알림켜기단추.disabled = true;
    알림글.textContent = "알림을 켜는 중… (허용할지 묻는 창이 뜨면 '허용'을 누르세요)";
    try {
      const 등록 = await navigator.serviceWorker.register("/sw.js");
      await navigator.serviceWorker.ready;

      const 허락 = await Notification.requestPermission();
      if (허락 !== "granted") {
        return 알림칸그리기({ 켜짐: false, 안내: 허락 === "denied"
          ? "알림을 '차단'으로 고르셨습니다. 주소창 왼쪽 자물쇠에서 알림을 '허용'으로 바꾼 뒤 다시 누르세요."
          : "알림을 허용하지 않아 켜지 못했습니다. 다시 누르고 '허용'을 골라 주세요." });
      }
      if (!공개열쇠) 공개열쇠 = (await 관리요청({ 작업: "알림상태" })).공개열쇠;

      let 구독 = await 등록.pushManager.getSubscription();
      const 옵션 = { userVisibleOnly: true, applicationServerKey: 열쇠바이트(공개열쇠) };
      try {
        if (!구독) 구독 = await 등록.pushManager.subscribe(옵션);
      } catch {
        // 예전에 다른 열쇠로 받던 흔적이 남아 있으면 지우고 다시 받습니다
        if (구독) await 구독.unsubscribe();
        구독 = await 등록.pushManager.subscribe(옵션);
      }

      const 결과 = await 관리요청({ 작업: "알림켜기", 구독: 구독.toJSON(), 기기: 기기설명() });
      알림칸그리기({ 켜짐: true, 기기수: 결과.기기수,
        안내: "켰습니다. '시험 알림 보내기'를 눌러 알림이 뜨는지 확인해 보세요." });
    } catch (err) {
      알림칸그리기({ 켜짐: false, 안내: "알림을 켜지 못했습니다: " + (err.message || "알 수 없는 문제") });
    } finally {
      알림켜기단추.disabled = false;
    }
  });

  알림끄기단추.addEventListener("click", async () => {
    알림끄기단추.disabled = true;
    try {
      const 구독 = await 이기기구독();
      const 결과 = await 관리요청({ 작업: "알림끄기", 구독: 구독 ? 구독.toJSON() : null });
      if (구독) await 구독.unsubscribe();
      알림칸그리기({ 켜짐: false, 기기수: 결과.기기수, 안내: "이 기기 알림을 껐습니다." });
    } catch (err) {
      알림글.textContent = err.message;
    } finally {
      알림끄기단추.disabled = false;
    }
  });

  알림시험단추.addEventListener("click", async () => {
    알림시험단추.disabled = true;
    알림글.textContent = "보내는 중…";
    try {
      const 결과 = await 관리요청({ 작업: "알림시험" });
      const 켜짐 = !알림끄기단추.hidden;
      알림칸그리기({ 켜짐, 기기수: 결과.기기수, 안내:
        결과.보냄 === 0 && 결과.실패 === 0 ? "알림 받는 기기가 없습니다. 먼저 '이 기기에서 알림 받기'를 누르세요." :
        결과.보냄 === 0 ? `보내지 못했습니다. 알림을 끈 기기는 목록에서 지웠으니, 받을 기기에서 다시 켜 주세요.` :
        `${결과.보냄}대에 보냈습니다. 몇 초 안에 알림이 뜨면 제대로 된 것입니다.` +
          (결과.실패 ? ` (${결과.실패}대는 실패 — 알림을 끈 기기는 목록에서 지웠습니다)` : "") });
    } catch (err) {
      알림글.textContent = err.message;
    } finally {
      알림시험단추.disabled = false;
    }
  });

  /* 알림을 눌렀는데 선생님 방이 이미 열려 있으면, sw.js 가 새 창 대신 이리로
     "이 질문으로 가라"고 알려 줍니다. 목록을 새로 받아 그 질문으로 갑니다. */
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.addEventListener("message", e => {
      if (!e.data || e.data.종류 !== "질문열기" || 안쪽.hidden) return;
      if (location.hash !== e.data.hash) history.replaceState(null, "", e.data.hash || "#");
      메일에서왔나 = true;
      질문불러오기();
    });
  }

  // 답 칸에서 Ctrl+Enter (맥은 ⌘+Enter) 로 바로 저장
  질문목록.addEventListener("keydown", e => {
    if (e.key !== "Enter" || !(e.ctrlKey || e.metaKey) || e.target.tagName !== "TEXTAREA") return;
    e.preventDefault();
    e.target.closest("article").querySelector('[data-act="답변"]').click();
  });

  async function 질문불러오기() {
    try {
      // 학생용 목록과 달리 '확인 대기 중'인 질문까지 받아 옵니다
      const 응답 = await fetch("/api/admin", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ 암호, 작업: "목록" }),
      });
      if (응답.status === 503) {
        질문목록.innerHTML = `<p class="empty">질문 게시판을 준비하고 있습니다.</p>`;
        return;
      }
      const 결과 = await 응답.json();
      if (!응답.ok) throw new Error();
      질문들 = 결과.목록 || [];
      document.getElementById("검토스위치").checked = Boolean(결과.검토);
      질문그리기();
    } catch {
      질문목록.innerHTML = `<p class="empty">질문을 불러오지 못했습니다.</p>`;
    }
  }

  document.getElementById("검토스위치").addEventListener("change", async e => {
    const 켬 = e.target.checked;
    e.target.disabled = true;
    try {
      const 응답 = await fetch("/api/admin", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ 암호, 작업: "검토스위치", 켬 }),
      });
      if (!응답.ok) throw new Error();
    } catch {
      e.target.checked = !켬;         // 실패하면 스위치를 되돌려 놓습니다
      alert("바꾸지 못했습니다. 잠시 뒤 다시 시도해 주세요.");
    } finally {
      e.target.disabled = false;
    }
  });

  질문목록.addEventListener("click", async e => {
    const 버튼 = e.target.closest("[data-act]");
    if (!버튼) return;
    const 글 = 버튼.closest("article");
    const 작업 = 버튼.dataset.act;
    const 쪽지 = 글.querySelector(".adm-status");
    const 답칸 = 글.querySelector("textarea");
    const 원래 = 질문들.find(it => String(it.id) === 글.dataset.id) || {};

    if (작업 === "삭제" && !confirm("이 질문을 지울까요? 되돌릴 수 없습니다.")) return;

    if (작업 === "답변" && !답칸.value.trim()) {
      // 빈 칸으로 저장하면 서버는 '답을 지우라'는 뜻으로 받습니다.
      // 아직 답이 없는 질문이면 실수로 누른 것이니 막고, 있던 답이면 한 번 묻습니다.
      if (!원래.a) { 쪽지.textContent = "답을 먼저 써 주세요."; 답칸.focus(); return; }
      if (!confirm("답을 지울까요? 이 질문은 다시 '답을 기다리는 질문'으로 돌아갑니다.")) return;
    }

    버튼.disabled = true;
    쪽지.textContent = { 삭제: "지우는 중…", 공개: "공개하는 중…" }[작업] || "저장하는 중…";
    try {
      const 응답 = await fetch("/api/admin", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          암호, 작업, id: 글.dataset.id,
          답변: 글.querySelector("textarea").value,
        }),
      });
      const 결과 = await 응답.json();
      if (!응답.ok) throw new Error(결과.오류 || "");

      질문들 = 작업 === "삭제"
        ? 질문들.filter(it => String(it.id) !== 글.dataset.id)
        : 질문들.map(it => (String(it.id) === 글.dataset.id ? 결과 : it));

      /* 저장한 질문은 목록에서 자리를 옮기므로(기다림 → 답함) 그 줄에 붙은
         '저장했습니다' 쪽지는 사라집니다. 대신 맨 위 요약줄에 한마디 남깁니다. */
      방금한일 =
        작업 === "삭제" ? "지웠습니다." :
        작업 === "공개" ? "학생에게 공개했습니다." :
        !결과.a ? "답을 지웠습니다." :
        결과.h ? "답을 저장했습니다 (아직 학생에게 안 보임 — '공개하기'를 누르세요)." :
        원래.a ? "답을 고쳤습니다." : "답을 올렸습니다 — 질문 페이지에 바로 보입니다.";
      질문그리기();
      // 줄이 옮겨 가도 선생님 눈이 요약줄로 가도록
      if (작업 !== "삭제") 질문요약.scrollIntoView({ block: "nearest", behavior: "smooth" });
    } catch (err) {
      쪽지.textContent = err.message || "실패했습니다.";
      버튼.disabled = false;
    }
  });

  /* ---------- 자료실 ---------- */
  let 수정중 = null; // 지금 제목을 고치고 있는 파일의 id (한 번에 하나만)

  function 파일그리기() {
    if (!파일들.length) {
      파일목록.innerHTML = `<p class="empty">아직 올린 파일이 없습니다.</p>`;
      return;
    }
    파일목록.innerHTML = `<div class="filelist">` + 파일들.map(f => {
      if (f.id === 수정중) {
        return `
      <div class="filelist-row adm-edit-row" data-id="${안전하게(f.id)}">
        <div class="adm-row">
          <input type="text" class="adm-edit-title" placeholder="제목" value="${안전하게(f.title)}" required />
          <input type="text" class="adm-edit-subject" placeholder="과목" value="${안전하게(f.subject)}" />
          <input type="text" class="adm-edit-kind" placeholder="종류" value="${안전하게(f.kind)}" />
        </div>
        <div class="adm-row">
          <select class="adm-edit-concept adm-concept"></select>
        </div>
        <div class="adm-row">
          <button type="button" class="btn btn-primary" data-act="저장">저장</button>
          <button type="button" class="adm-del" data-act="취소">취소</button>
          <span class="caption adm-status"></span>
        </div>
      </div>`;
      }
      return `
      <div class="filelist-row">
        <a href="${안전하게(f.url)}" target="_blank" rel="noopener">
          <span class="caption filelist-date">${안전하게(f.date)}</span>
          <span class="filelist-main">
            <b>${안전하게(f.title)}</b>
            <span class="caption">${[f.subject, f.kind, 크기표시(f.size),
              f.concept ? "개념: " + 개념이름(f.concept) : "개념 연결 안 됨"]
              .filter(Boolean).map(안전하게).join(" · ")}</span>
          </span>
          <span class="filelist-go" aria-hidden="true">열기 ↗</span>
        </a>
        <button type="button" class="adm-del" data-act="수정" data-id="${안전하게(f.id)}">수정</button>
        <button type="button" class="adm-del" data-act="삭제" data-id="${안전하게(f.id)}">지우기</button>
      </div>`;
    }).join("") + `</div>`;

    // 고치는 줄이 새로 그려졌으면 개념 칸을 채워 둡니다
    const 고치는칸 = 파일목록.querySelector(".adm-edit-concept");
    if (고치는칸) {
      const f = 파일들.find(x => x.id === 수정중);
      개념칸채우기(고치는칸, f ? f.concept || "" : "");
    }
  }

  async function 파일불러오기() {
    try {
      const 응답 = await fetch("/api/files");
      if (응답.status === 503) {
        파일목록.innerHTML = `<p class="empty">자료실 저장소를 준비하고 있습니다.</p>`;
        return;
      }
      파일들 = await 응답.json();
      파일그리기();
    } catch {
      파일목록.innerHTML = `<p class="empty">목록을 불러오지 못했습니다.</p>`;
    }
  }

  파일목록.addEventListener("click", async e => {
    const 버튼 = e.target.closest("[data-act]");
    if (!버튼) return;
    const 작업 = 버튼.dataset.act;

    if (작업 === "수정") {
      수정중 = 버튼.dataset.id;
      파일그리기();
      return;
    }
    if (작업 === "취소") {
      수정중 = null;
      파일그리기();
      return;
    }

    if (작업 === "삭제") {
      if (!confirm("이 파일을 지울까요? 되돌릴 수 없습니다.")) return;
      버튼.disabled = true;
      try {
        const 응답 = await fetch(
          `/api/files-admin?act=delete&id=${encodeURIComponent(버튼.dataset.id)}&암호=${encodeURIComponent(암호)}`,
          { method: "POST" });
        const 결과 = await 응답.json();
        if (!응답.ok) throw new Error(결과.오류 || "");
        파일들 = 파일들.filter(f => f.id !== 버튼.dataset.id);
        파일그리기();
      } catch (err) {
        alert(err.message || "지우지 못했습니다.");
        버튼.disabled = false;
      }
      return;
    }

    if (작업 === "저장") {
      const 줄 = 버튼.closest(".adm-edit-row");
      const id = 줄.dataset.id;
      const 쪽지 = 줄.querySelector(".adm-status");
      const 제목 = 줄.querySelector(".adm-edit-title").value.trim();
      if (!제목) { 쪽지.textContent = "제목을 입력해 주세요."; return; }

      버튼.disabled = true;
      쪽지.textContent = "저장하는 중…";
      try {
        const 주소 = "/api/files-admin?" + new URLSearchParams({
          act: "edit", 암호, id,
          title: 제목,
          subject: 줄.querySelector(".adm-edit-subject").value.trim(),
          kind: 줄.querySelector(".adm-edit-kind").value.trim(),
          concept: 줄.querySelector(".adm-edit-concept")?.value || "",
        });
        const 응답 = await fetch(주소, { method: "POST" });
        const 결과 = await 응답.json();
        if (!응답.ok) throw new Error(결과.오류 || "");
        파일들 = 파일들.map(f => (f.id === id ? 결과 : f));
        수정중 = null;
        파일그리기();
      } catch (err) {
        쪽지.textContent = err.message || "저장하지 못했습니다.";
        버튼.disabled = false;
      }
    }
  });

  올리기.addEventListener("submit", async e => {
    e.preventDefault();
    const 쪽지 = 올리기.querySelector(".adm-status");
    const 파일 = 올리기.file.files[0];
    if (!파일) return;

    const 확장자 = (파일.name.split(".").pop() || "").toLowerCase();
    if (!["pdf", "hwp", "hwpx"].includes(확장자)) {
      쪽지.textContent = "pdf, hwp, hwpx 파일만 올릴 수 있습니다.";
      return;
    }
    if (파일.size > 50 * 1024 * 1024) {
      쪽지.textContent = "파일이 너무 큽니다 (50MB까지).";
      return;
    }

    const 버튼 = 올리기.querySelector('button[type="submit"]');
    버튼.disabled = true;
    쪽지.textContent = "준비하는 중…";
    try {
      /* 1걸음 — 이 파일을 올려도 좋다는 일회용 주소를 받아 옵니다 */
      const 준비 = await fetch("/api/files-admin?" + new URLSearchParams({
        act: "presign", 암호, filename: 파일.name, size: String(파일.size),
      }), { method: "POST" });
      const 표 = await 준비.json();
      if (!준비.ok) throw new Error(표.오류 || "");

      /* 2걸음 — 파일을 저장소로 곧장 보냅니다. 우리 서버를 안 거치므로
         크기 제한이 없고, 대신 얼마나 갔는지 알려면 XHR 이 필요합니다
         (fetch 는 올리는 진행률을 알려주지 않습니다) */
      await new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open("PUT", 표.presignedUrl);
        xhr.setRequestHeader("Content-Type", 표.contentType);
        xhr.upload.onprogress = ev => {
          if (!ev.lengthComputable) return;
          쪽지.textContent = `올리는 중… ${Math.round((ev.loaded / ev.total) * 100)}%`;
        };
        xhr.onload = () => (xhr.status >= 200 && xhr.status < 300
          ? resolve()
          : reject(new Error("저장소가 파일을 받지 못했습니다.")));
        xhr.onerror = () => reject(new Error("인터넷이 끊겼습니다."));
        xhr.send(파일);
      });

      /* 3걸음 — 정말 올라갔는지 확인하고 목록에 적습니다 */
      쪽지.textContent = "마무리하는 중…";
      const 마무리 = await fetch("/api/files-admin?" + new URLSearchParams({
        act: "record", 암호, id: 표.id, pathname: 표.pathname, filename: 파일.name,
        title: 올리기.title.value, subject: 올리기.subject.value, kind: 올리기.kind.value,
        concept: 올리기.concept.value,
      }), { method: "POST" });
      const 결과 = await 마무리.json();
      if (!마무리.ok) throw new Error(결과.오류 || "");

      파일들.unshift(결과);
      파일그리기();
      올리기.reset();
      쪽지.textContent = "올렸습니다.";
    } catch (err) {
      쪽지.textContent = err.message || "올리지 못했습니다.";
    } finally {
      버튼.disabled = false;
    }
  });

  /* ---------- 문 여닫기 ---------- */
  function 들어가기() {
    문앞.hidden = true;
    안쪽.hidden = false;
    개념칸채우기(올리기.concept);
    질문불러오기();   // 화면 맨 위에 있는 것부터
    알림상태확인();
    공지불러오기();
    파일불러오기();
  }

  /* ---------- 전부 내보내기 (백업) ----------
     질문·답과 자료 목록을 파일 하나로 내려받습니다. 선생님이 쓴 답글이
     가장 되살리기 어려운 것이라, 그것부터 확실히 남겨 둡니다.
     (자료 파일 자체는 용량이 커서 넣지 않고 주소만 담습니다) */
  document.getElementById("내려받기").onclick = async e => {
    const 버튼 = e.target;
    버튼.disabled = true;
    const 원래글 = 버튼.textContent;
    버튼.textContent = "모으는 중…";
    try {
      const 꾸러미 = {
        내려받은날: new Date().toISOString(),
        공지: 공지들,
        질문: 질문들,
        자료: 파일들,
      };
      const 주소 = URL.createObjectURL(
        new Blob([JSON.stringify(꾸러미, null, 2)], { type: "application/json" }));
      const 링크 = document.createElement("a");
      링크.href = 주소;
      링크.download = `수학을보다-백업-${new Date().toISOString().slice(0, 10)}.json`;
      링크.click();
      URL.revokeObjectURL(주소);
      버튼.textContent = "내려받았습니다";
      setTimeout(() => (버튼.textContent = 원래글), 2000);
    } catch {
      버튼.textContent = "실패했습니다";
      setTimeout(() => (버튼.textContent = 원래글), 2000);
    } finally {
      버튼.disabled = false;
    }
  };

  document.getElementById("나가기").onclick = () => {
    암호 = "";
    보관함지우기();          // '이 기기에서 기억하기'로 남겨 둔 것까지
    document.title = 원래제목;
    안쪽.hidden = true;
    문앞.hidden = false;
  };

  const 암호확인 = 시험할암호 => fetch("/api/admin", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ 암호: 시험할암호, 작업: "확인" }),
  });

  로그인.addEventListener("submit", async e => {
    e.preventDefault();
    const 칸 = 로그인.querySelector('input[type="password"]');
    const 쪽지 = 로그인.querySelector(".adm-status");
    쪽지.textContent = "확인 중…";
    try {
      const 응답 = await 암호확인(칸.value);
      if (!응답.ok) {
        쪽지.textContent = "암호가 맞지 않습니다.";
        return;
      }
      암호 = 칸.value;
      보관함지우기();
      try {
        (document.getElementById("암호기억").checked ? localStorage : sessionStorage).setItem(암호열쇠, 암호);
      } catch { /* 저장소를 막아 둔 브라우저 — 이번 창에서만 들어가 있습니다 */ }
      칸.value = "";
      쪽지.textContent = "";
      들어가기();
    } catch {
      쪽지.textContent = "지금은 확인할 수 없습니다. 잠시 뒤 다시 시도해 주세요.";
    }
  });

  /* 전에 들어와 있었으면 암호를 다시 묻지 않습니다. 다만 그사이 Vercel 에서
     암호를 바꿨을 수 있으니, 들어가기 전에 한 번 맞춰 봅니다 — 안 그러면
     안에 들어가서 답을 쓰고 저장을 누를 때에야 "암호가 틀렸다"고 나옵니다. */
  if (암호) {
    암호확인(암호)
      .then(응답 => {
        if (응답.ok) return 들어가기();
        if (응답.status === 401) {
          보관함지우기();
          암호 = "";
          로그인.querySelector(".adm-status").textContent = "암호가 바뀌었습니다. 새 암호를 넣어 주세요.";
        }
      })
      .catch(() => 들어가기());   // 잠깐 인터넷이 끊긴 것이면 일단 들여보냅니다 (안에서 다시 불러옵니다)
  }
}
</script>

</body>
</html>
