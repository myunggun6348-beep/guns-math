<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="assets/theme.js"></script>
<title>선생님 방 · 수학을 보다</title>

<!-- 검색엔진에 잡히지 않게 합니다. 학생이 검색하다 흘러들어올 이유가 없습니다.
     (물론 진짜 잠금은 암호입니다 — 이건 '눈에 안 띄게' 하는 것뿐입니다) -->
<meta name="robots" content="noindex, nofollow" />

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='13.5' cy='13.5' r='9' fill='%23d9f26e'/%3E%3Cpath d='M6 16q3.75-8 7.5-2.5t7.5-2.5' fill='none' stroke='%23000' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='13.5' cy='13.5' r='9' fill='none' stroke='%23000' stroke-width='2.5'/%3E%3Cpath d='M20 20l7.5 7.5' stroke='%23000' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />

<link rel="stylesheet" href="assets/vendor/fonts/pretendard.css" />
<link rel="stylesheet" href="assets/vendor/fonts/jetbrains-mono.css" />
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>

<!-- ===================== 상단 내비 =====================
     학생용 메뉴(공지·자료·질문)는 여기 두지 않습니다. 이 페이지에서 할 일은
     '답 달기'와 '자료 올리기' 둘뿐이라, 나갈 문 하나만 있으면 됩니다. -->
<header class="nav">
  <div class="wrap">
    <a class="brand" href="index.html">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="13.5" cy="13.5" r="9" fill="#d9f26e" />
        <path d="M6 16q3.75-8 7.5-2.5t7.5-2.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        <circle cx="13.5" cy="13.5" r="9" fill="none" stroke="currentColor" stroke-width="2.5" />
        <path d="M20 20l7.5 7.5" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
      </svg>
      수학을 보다
    </a>
    <div class="nav-links">
      <a href="index.html">사이트 보기 →</a>
    </div>
    <div class="nav-right">
      <button type="button" id="themeToggle" class="theme-toggle" aria-pressed="false" aria-label="어두운 화면으로 보기">
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" /></svg>
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
      </button>
    </div>
  </div>
</header>

<section class="section" style="padding-top: var(--xxl);">
  <div class="wrap">

    <!-- ---------- 암호 넣기 (들어오면 이것만 보입니다) ---------- -->
    <div id="문앞">
      <span class="eyebrow">Admin</span>
      <h1 class="display-lg">선생님 방</h1>
      <p class="body-lg" style="margin-top: var(--md); max-width: 30em;">
        암호를 넣으면 질문에 답을 달고, 자료실에 파일을 올릴 수 있습니다.
      </p>
      <form class="adm-login" id="로그인">
        <input type="password" placeholder="암호" autocomplete="current-password" required />
        <button type="submit" class="btn btn-primary">들어가기 →</button>
        <p class="caption adm-status" role="status" aria-live="polite"></p>
      </form>
    </div>

    <!-- ---------- 들어온 다음 (암호를 맞혀야 보입니다) ---------- -->
    <div id="안쪽" hidden>
      <div class="adm-top">
        <div>
          <span class="eyebrow">Admin</span>
          <h1 class="display-lg">선생님 방</h1>
        </div>
        <button type="button" id="나가기">나가기</button>
      </div>

      <!-- ===== 자료실 ===== -->
      <section class="adm-block">
        <h2 class="display-sm">자료실</h2>
        <p class="body-sm adm-note">
          pdf · hwp · hwpx 파일을 올릴 수 있습니다. 하나에 50MB까지입니다.
          올리는 즉시 자료실과 홈 검색에 나타납니다.
        </p>

        <form class="adm-upload" id="파일올리기">
          <div class="adm-row">
            <input type="text" name="title" placeholder="제목 (예: 미분계수 연습 20제)" required />
            <input type="text" name="subject" placeholder="과목 (예: 미적분Ⅰ)" />
            <input type="text" name="kind" placeholder="종류 (예: 학습지)" />
          </div>
          <div class="adm-row">
            <!-- 개념을 골라 두면 개념 지도에서 그 개념을 눌렀을 때 이 학습지가
                 같이 나옵니다. 목록은 assets/concepts.js 에서 자동으로 만듭니다. -->
            <select name="concept" class="adm-concept"></select>
          </div>
          <div class="adm-row">
            <input type="file" name="file" accept=".pdf,.hwp,.hwpx" required />
            <button type="submit" class="btn btn-primary">올리기 ↑</button>
          </div>
          <p class="caption adm-status" role="status" aria-live="polite"></p>
        </form>

        <div id="파일목록"></div>
      </section>

      <!-- ===== 질문 ===== -->
      <section class="adm-block">
        <h2 class="display-sm">받은 질문</h2>
        <p class="body-sm adm-note">
          답을 쓰고 저장하면 질문 페이지에 바로 올라갑니다.
          장난 글은 '지우기'로 없앨 수 있습니다.
        </p>
        <div id="질문목록"></div>
      </section>
    </div>

  </div>
</section>

<footer class="footer">
  <div class="wrap">
    <p class="footer-base body-sm">선생님 전용 페이지입니다.</p>
  </div>
</footer>

<!-- 개념 목록 — 자료를 올릴 때 '어느 개념인지' 고르는 칸을 여기서 만듭니다 -->
<script src="assets/concepts.js"></script>

<script>
/* =========================================================
   선생님 방 — 손대지 않아도 됩니다.

   질문에 답을 달고 자료를 올리는 일을 여기 한곳에 모아 뒀습니다.
   학생이 보는 페이지(ask.html · files.html)에는 이런 칸이 아예 없습니다.

   암호는 Vercel 에 넣어 둔 ADMIN_PASSWORD 입니다. 이 파일에는 암호가
   들어 있지 않아서, 코드가 공개돼도 암호는 새지 않습니다.
   ========================================================= */
{
  const 문앞 = document.getElementById("문앞");
  const 안쪽 = document.getElementById("안쪽");
  const 로그인 = document.getElementById("로그인");
  const 질문목록 = document.getElementById("질문목록");
  const 파일목록 = document.getElementById("파일목록");
  const 올리기 = document.getElementById("파일올리기");

  // sessionStorage 라서 창을 닫으면 지워집니다 — 공용 컴퓨터에서 안전하도록
  let 암호 = sessionStorage.getItem("수학을보다-암호") || "";
  let 질문들 = [];
  let 파일들 = [];

  /* 학생이 쓴 글을 그대로 화면에 박으면 <script> 같은 걸 적어 넣었을 때
     그게 코드로 실행돼 버립니다. 꺾쇠 같은 기호를 '글자'로 바꿔서 막습니다. */
  const 안전하게 = 글 => String(글 ?? "").replace(/[&<>"']/g, 기호 => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[기호]));

  const 크기표시 = 바이트 => {
    if (!바이트) return "";
    const kb = 바이트 / 1024;
    return kb < 1024 ? `${Math.round(kb)}KB` : `${(kb / 1024).toFixed(1)}MB`;
  };

  /* ---------- 개념 고르는 칸 ----------
     개념 지도(assets/concepts.js)에 있는 개념을 학년·과목으로 묶어 보여 줍니다.
     여기서 고른 개념이 지도에서 이 학습지를 불러 주는 열쇠가 됩니다. */
  const 개념이름 = id => (typeof NODES !== "undefined" && NODES[id] ? NODES[id].name : "");

  function 개념칸채우기(칸, 고른것 = "") {
    if (typeof NODES === "undefined") { 칸.hidden = true; return; }
    const 묶음 = {};
    for (const [id, n] of Object.entries(NODES)) {
      (묶음[`${n.year} · ${n.subject}`] ||= []).push([id, n.name]);
    }
    칸.innerHTML =
      `<option value="">개념 연결 안 함 (자료실에만 두기)</option>` +
      Object.entries(묶음).map(([제목, 것들]) =>
        `<optgroup label="${제목}">` +
        것들.map(([id, 이름]) =>
          `<option value="${안전하게(id)}"${id === 고른것 ? " selected" : ""}>${안전하게(이름)}</option>`
        ).join("") + `</optgroup>`
      ).join("");
  }

  /* ---------- 질문 ---------- */
  function 질문그리기() {
    if (!질문들.length) {
      질문목록.innerHTML = `<p class="empty">아직 들어온 질문이 없습니다.</p>`;
      return;
    }
    질문목록.innerHTML = 질문들.map(it => `
      <article class="adm-q" data-id="${안전하게(it.id)}">
        <p class="caption">${안전하게(it.t)}${it.g ? " · " + 안전하게(it.g) : ""}${it.a ? "" : " · 답 없음"}</p>
        <p class="adm-q-text">${안전하게(it.q)}</p>
        <textarea rows="3" placeholder="답을 여기에 쓰고 저장을 누르세요">${안전하게(it.a)}</textarea>
        <div class="adm-row">
          <button type="button" class="btn btn-primary" data-act="답변">답 저장</button>
          <button type="button" class="adm-del" data-act="삭제">지우기</button>
          <span class="caption adm-status"></span>
        </div>
      </article>`).join("");
  }

  async function 질문불러오기() {
    try {
      const 응답 = await fetch("/api/questions");
      if (응답.status === 503) {
        질문목록.innerHTML = `<p class="empty">질문 게시판을 준비하고 있습니다.</p>`;
        return;
      }
      질문들 = await 응답.json();
      질문그리기();
    } catch {
      질문목록.innerHTML = `<p class="empty">질문을 불러오지 못했습니다.</p>`;
    }
  }

  질문목록.addEventListener("click", async e => {
    const 버튼 = e.target.closest("[data-act]");
    if (!버튼) return;
    const 글 = 버튼.closest("article");
    const 작업 = 버튼.dataset.act;
    const 쪽지 = 글.querySelector(".adm-status");

    if (작업 === "삭제" && !confirm("이 질문을 지울까요? 되돌릴 수 없습니다.")) return;

    버튼.disabled = true;
    쪽지.textContent = 작업 === "삭제" ? "지우는 중…" : "저장하는 중…";
    try {
      const 응답 = await fetch("/api/admin", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          암호, 작업, id: 글.dataset.id,
          답변: 글.querySelector("textarea").value,
        }),
      });
      const 결과 = await 응답.json();
      if (!응답.ok) throw new Error(결과.오류 || "");

      질문들 = 작업 === "삭제"
        ? 질문들.filter(it => String(it.id) !== 글.dataset.id)
        : 질문들.map(it => (String(it.id) === 글.dataset.id ? 결과 : it));
      질문그리기();
    } catch (err) {
      쪽지.textContent = err.message || "실패했습니다.";
      버튼.disabled = false;
    }
  });

  /* ---------- 자료실 ---------- */
  let 수정중 = null; // 지금 제목을 고치고 있는 파일의 id (한 번에 하나만)

  function 파일그리기() {
    if (!파일들.length) {
      파일목록.innerHTML = `<p class="empty">아직 올린 파일이 없습니다.</p>`;
      return;
    }
    파일목록.innerHTML = `<div class="filelist">` + 파일들.map(f => {
      if (f.id === 수정중) {
        return `
      <div class="filelist-row adm-edit-row" data-id="${안전하게(f.id)}">
        <div class="adm-row">
          <input type="text" class="adm-edit-title" placeholder="제목" value="${안전하게(f.title)}" required />
          <input type="text" class="adm-edit-subject" placeholder="과목" value="${안전하게(f.subject)}" />
          <input type="text" class="adm-edit-kind" placeholder="종류" value="${안전하게(f.kind)}" />
        </div>
        <div class="adm-row">
          <select class="adm-edit-concept adm-concept"></select>
        </div>
        <div class="adm-row">
          <button type="button" class="btn btn-primary" data-act="저장">저장</button>
          <button type="button" class="adm-del" data-act="취소">취소</button>
          <span class="caption adm-status"></span>
        </div>
      </div>`;
      }
      return `
      <div class="filelist-row">
        <a href="${안전하게(f.url)}" target="_blank" rel="noopener">
          <span class="caption filelist-date">${안전하게(f.date)}</span>
          <span class="filelist-main">
            <b>${안전하게(f.title)}</b>
            <span class="caption">${[f.subject, f.kind, 크기표시(f.size),
              f.concept ? "개념: " + 개념이름(f.concept) : "개념 연결 안 됨"]
              .filter(Boolean).map(안전하게).join(" · ")}</span>
          </span>
          <span class="filelist-go" aria-hidden="true">열기 ↗</span>
        </a>
        <button type="button" class="adm-del" data-act="수정" data-id="${안전하게(f.id)}">수정</button>
        <button type="button" class="adm-del" data-act="삭제" data-id="${안전하게(f.id)}">지우기</button>
      </div>`;
    }).join("") + `</div>`;

    // 고치는 줄이 새로 그려졌으면 개념 칸을 채워 둡니다
    const 고치는칸 = 파일목록.querySelector(".adm-edit-concept");
    if (고치는칸) {
      const f = 파일들.find(x => x.id === 수정중);
      개념칸채우기(고치는칸, f ? f.concept || "" : "");
    }
  }

  async function 파일불러오기() {
    try {
      const 응답 = await fetch("/api/files");
      if (응답.status === 503) {
        파일목록.innerHTML = `<p class="empty">자료실 저장소를 준비하고 있습니다.</p>`;
        return;
      }
      파일들 = await 응답.json();
      파일그리기();
    } catch {
      파일목록.innerHTML = `<p class="empty">목록을 불러오지 못했습니다.</p>`;
    }
  }

  파일목록.addEventListener("click", async e => {
    const 버튼 = e.target.closest("[data-act]");
    if (!버튼) return;
    const 작업 = 버튼.dataset.act;

    if (작업 === "수정") {
      수정중 = 버튼.dataset.id;
      파일그리기();
      return;
    }
    if (작업 === "취소") {
      수정중 = null;
      파일그리기();
      return;
    }

    if (작업 === "삭제") {
      if (!confirm("이 파일을 지울까요? 되돌릴 수 없습니다.")) return;
      버튼.disabled = true;
      try {
        const 응답 = await fetch(
          `/api/files-admin?act=delete&id=${encodeURIComponent(버튼.dataset.id)}&암호=${encodeURIComponent(암호)}`,
          { method: "POST" });
        const 결과 = await 응답.json();
        if (!응답.ok) throw new Error(결과.오류 || "");
        파일들 = 파일들.filter(f => f.id !== 버튼.dataset.id);
        파일그리기();
      } catch (err) {
        alert(err.message || "지우지 못했습니다.");
        버튼.disabled = false;
      }
      return;
    }

    if (작업 === "저장") {
      const 줄 = 버튼.closest(".adm-edit-row");
      const id = 줄.dataset.id;
      const 쪽지 = 줄.querySelector(".adm-status");
      const 제목 = 줄.querySelector(".adm-edit-title").value.trim();
      if (!제목) { 쪽지.textContent = "제목을 입력해 주세요."; return; }

      버튼.disabled = true;
      쪽지.textContent = "저장하는 중…";
      try {
        const 주소 = "/api/files-admin?" + new URLSearchParams({
          act: "edit", 암호, id,
          title: 제목,
          subject: 줄.querySelector(".adm-edit-subject").value.trim(),
          kind: 줄.querySelector(".adm-edit-kind").value.trim(),
          concept: 줄.querySelector(".adm-edit-concept")?.value || "",
        });
        const 응답 = await fetch(주소, { method: "POST" });
        const 결과 = await 응답.json();
        if (!응답.ok) throw new Error(결과.오류 || "");
        파일들 = 파일들.map(f => (f.id === id ? 결과 : f));
        수정중 = null;
        파일그리기();
      } catch (err) {
        쪽지.textContent = err.message || "저장하지 못했습니다.";
        버튼.disabled = false;
      }
    }
  });

  올리기.addEventListener("submit", async e => {
    e.preventDefault();
    const 쪽지 = 올리기.querySelector(".adm-status");
    const 파일 = 올리기.file.files[0];
    if (!파일) return;

    const 확장자 = (파일.name.split(".").pop() || "").toLowerCase();
    if (!["pdf", "hwp", "hwpx"].includes(확장자)) {
      쪽지.textContent = "pdf, hwp, hwpx 파일만 올릴 수 있습니다.";
      return;
    }
    if (파일.size > 50 * 1024 * 1024) {
      쪽지.textContent = "파일이 너무 큽니다 (50MB까지).";
      return;
    }

    const 버튼 = 올리기.querySelector('button[type="submit"]');
    버튼.disabled = true;
    쪽지.textContent = "준비하는 중…";
    try {
      /* 1걸음 — 이 파일을 올려도 좋다는 일회용 주소를 받아 옵니다 */
      const 준비 = await fetch("/api/files-admin?" + new URLSearchParams({
        act: "presign", 암호, filename: 파일.name, size: String(파일.size),
      }), { method: "POST" });
      const 표 = await 준비.json();
      if (!준비.ok) throw new Error(표.오류 || "");

      /* 2걸음 — 파일을 저장소로 곧장 보냅니다. 우리 서버를 안 거치므로
         크기 제한이 없고, 대신 얼마나 갔는지 알려면 XHR 이 필요합니다
         (fetch 는 올리는 진행률을 알려주지 않습니다) */
      await new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open("PUT", 표.presignedUrl);
        xhr.setRequestHeader("Content-Type", 표.contentType);
        xhr.upload.onprogress = ev => {
          if (!ev.lengthComputable) return;
          쪽지.textContent = `올리는 중… ${Math.round((ev.loaded / ev.total) * 100)}%`;
        };
        xhr.onload = () => (xhr.status >= 200 && xhr.status < 300
          ? resolve()
          : reject(new Error("저장소가 파일을 받지 못했습니다.")));
        xhr.onerror = () => reject(new Error("인터넷이 끊겼습니다."));
        xhr.send(파일);
      });

      /* 3걸음 — 정말 올라갔는지 확인하고 목록에 적습니다 */
      쪽지.textContent = "마무리하는 중…";
      const 마무리 = await fetch("/api/files-admin?" + new URLSearchParams({
        act: "record", 암호, id: 표.id, pathname: 표.pathname,
        title: 올리기.title.value, subject: 올리기.subject.value, kind: 올리기.kind.value,
        concept: 올리기.concept.value,
      }), { method: "POST" });
      const 결과 = await 마무리.json();
      if (!마무리.ok) throw new Error(결과.오류 || "");

      파일들.unshift(결과);
      파일그리기();
      올리기.reset();
      쪽지.textContent = "올렸습니다.";
    } catch (err) {
      쪽지.textContent = err.message || "올리지 못했습니다.";
    } finally {
      버튼.disabled = false;
    }
  });

  /* ---------- 문 여닫기 ---------- */
  function 들어가기() {
    문앞.hidden = true;
    안쪽.hidden = false;
    개념칸채우기(올리기.concept);
    질문불러오기();
    파일불러오기();
  }

  document.getElementById("나가기").onclick = () => {
    암호 = "";
    sessionStorage.removeItem("수학을보다-암호");
    안쪽.hidden = true;
    문앞.hidden = false;
  };

  로그인.addEventListener("submit", async e => {
    e.preventDefault();
    const 칸 = 로그인.querySelector("input");
    const 쪽지 = 로그인.querySelector(".adm-status");
    쪽지.textContent = "확인 중…";
    try {
      const 응답 = await fetch("/api/admin", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ 암호: 칸.value, 작업: "확인" }),
      });
      if (!응답.ok) {
        쪽지.textContent = "암호가 맞지 않습니다.";
        return;
      }
      암호 = 칸.value;
      sessionStorage.setItem("수학을보다-암호", 암호);
      쪽지.textContent = "";
      들어가기();
    } catch {
      쪽지.textContent = "지금은 확인할 수 없습니다. 잠시 뒤 다시 시도해 주세요.";
    }
  });

  // 아까 들어와 있었으면 암호를 다시 묻지 않습니다 (창을 닫으면 지워집니다)
  if (암호) 들어가기();
}
</script>

</body>
</html>
