<!-- 개념 목록은 홈의 찾기와 함께 쓰므로 따로 빼 두었습니다 -->
<script src="assets/concepts.js"></script>

<script>
/* =========================================================
   개념 지도 그리기

   개념·층·연결(NODES / LAYERS / EDGES)은 위 assets/concepts.js 에 있습니다.
   상자 위치는 CSS(flex)가 정하고, 아래 script 는 그려진 위치를 재서
   선만 얹습니다 — 그래서 화면 폭이 바뀌어도 저절로 다시 배치됩니다.
   ========================================================= */

const cmap   = document.getElementById("cmap");
const lines  = document.getElementById("cmapLines");
const panel  = document.getElementById("cmapPanel");
const 깊게   = document.getElementById("cmapDeep");
const 범례   = document.getElementById("cmapLegend");
const NS = "http://www.w3.org/2000/svg";

const before = id => EDGES.filter(e => e[1] === id).map(e => e[0]);
const after  = id => EDGES.filter(e => e[0] === id).map(e => e[1]);

/* ---------- 자료실 학습지 ----------
   선생님이 자료를 올릴 때 고른 개념을 여기서 읽어, 그 개념을 눌렀을 때
   '볼 것(데모)' 옆에 '풀 것(학습지)'을 같이 놓습니다. 자료실은 수시로
   바뀌므로 코드에 적어 두지 않고 /api/files 에서 그때그때 받아 옵니다. */
let 파일들 = [];
const 학습지 = id => 파일들.filter(f => f.concept === id);

const 안전하게 = 글 => String(글 ?? "").replace(/[&<>"']/g, 기호 => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
}[기호]));

/* 층에 적힌 순서가 곧 배우는 순서. 아래에서 '전부'를 이 순서로 돌려주므로
   나온 것을 위에서부터 읽으면 그대로 공부 순서가 됩니다. */
const 배운순서 = LAYERS.flatMap(l => l.ids);

/* 거슬러 올라가며 앞선 개념을 전부 모읍니다.
   한 단계만 보여 주면 "미적분Ⅱ 하려면 뭘 알아야 해요"에 답이 안 됩니다 —
   그 답은 사슬 전체이기 때문입니다.
   (이미 담은 것은 건너뛰므로 여러 길로 만나는 개념도 한 번만 나옵니다) */
function 앞전부(id) {
  const 모음 = new Set();
  const 대기 = [...before(id)];
  while (대기.length) {
    const 지금 = 대기.pop();
    if (모음.has(지금)) continue;
    모음.add(지금);
    대기.push(...before(지금));
  }
  return 배운순서.filter(x => 모음.has(x));
}

for (const layer of LAYERS) {
  const row = document.createElement("div");
  row.className = "cmap-layer";
  row.innerHTML =
    `<h2 class="cmap-layer-label caption">${layer.label}</h2>` +
    `<div class="cmap-row">` +
    layer.ids.map(id => {
      const n = NODES[id];
      return `<button type="button" class="cmap-node" data-id="${id}">
        <span class="dot" style="background:${SUBJECT_COLOR[n.subject]}"></span>
        <span class="cmap-node-name">${n.name}</span>
        <span class="cmap-node-n"${n.demos.length ? "" : " hidden"}>${n.demos.length}</span>
      </button>`;
    }).join("") +
    `</div>`;
  cmap.appendChild(row);
}

const nodeEl = id => cmap.querySelector(`.cmap-node[data-id="${id}"]`);

/* 상자가 실제로 놓인 자리를 재서 잇는 선을 그립니다.
   화면 폭이 바뀌면 상자가 다시 배치되므로 그때마다 다시 그립니다. */
function drawLines() {
  const box = cmap.getBoundingClientRect();
  lines.setAttribute("width", box.width);
  lines.setAttribute("height", box.height);
  lines.setAttribute("viewBox", `0 0 ${box.width} ${box.height}`);
  lines.innerHTML = "";

  for (const [from, to] of EDGES) {
    const a = nodeEl(from).getBoundingClientRect();
    const b = nodeEl(to).getBoundingClientRect();
    let d;

    if (Math.abs(a.top - b.top) < 4) {
      /* 같은 줄에 나란히 있는 두 개념 (예: 평면벡터 → 공간도형).
         위아래로 이으면 선이 거꾸로 올라가므로, 옆으로 잇고 아래로 부풀린다. */
      const x1 = a.right - box.left, y1 = a.top - box.top + a.height / 2;
      const x2 = b.left - box.left,  y2 = b.top - box.top + b.height / 2;
      const sag = 18;
      d = `M${x1},${y1} C${x1 + 16},${y1 + sag} ${x2 - 16},${y2 + sag} ${x2},${y2}`;
    } else {
      const x1 = a.left - box.left + a.width / 2, y1 = a.bottom - box.top;
      const x2 = b.left - box.left + b.width / 2, y2 = b.top - box.top;
      const dy = Math.max(18, (y2 - y1) / 2);
      d = `M${x1},${y1} C${x1},${y1 + dy} ${x2},${y2 - dy} ${x2},${y2}`;
    }

    const p = document.createElementNS(NS, "path");
    p.setAttribute("d", d);
    p.setAttribute("class", "cmap-line");
    p.dataset.from = from;
    p.dataset.to = to;
    lines.appendChild(p);
  }
  if (selected) markLines(selected);
}

/* ---------- 개념 하나를 골랐을 때 ---------- */
let selected = null;
let 앞집합 = new Set();    // 지금 밝혀 둔 '먼저 알아야 하는 것'
let 뒤집합 = new Set();    // 지금 밝혀 둔 '여기서 이어지는 것'

/* 상자에 표시 달기.
   예전에는 선만 밝히고 상자는 그대로 두었는데, 그러면 얇은 선을 눈으로
   따라가야 답을 알 수 있었다. 지도가 하려는 말이 '이게 있어야 저게 된다'인데
   그 답이 선 하나에만 실려 있던 셈이다. */
function markNodes(id) {
  cmap.classList.add("has-selection");
  for (const el of cmap.querySelectorAll(".cmap-node")) {
    const i = el.dataset.id;
    el.classList.toggle("on", i === id);
    el.classList.toggle("pre", 앞집합.has(i));
    el.classList.toggle("post", 뒤집합.has(i));
    el.setAttribute("aria-pressed", i === id ? "true" : "false");
  }
  범례.hidden = false;
}

function markLines(id) {
  for (const p of lines.querySelectorAll(".cmap-line")) {
    const { from, to } = p.dataset;
    // 고른 개념에 바로 닿는 선
    const 닿음 = from === id || to === id;
    /* '전부 보기'일 때는 앞쪽 사슬 안에서 이어지는 선도 길의 일부다.
       (앞 → 앞, 또는 앞 → 고른 것) */
    const 길 = 앞집합.has(from) && (앞집합.has(to) || to === id);
    p.classList.toggle("on", 닿음 || 길);
  }
}

// 앞쪽이 비었을 때와 뒤쪽이 비었을 때는 뜻이 다르므로 문구도 다르게
function chips(ids, empty) {
  if (!ids.length) return `<span class="cmap-none">${empty}</span>`;
  return ids.map(i => `<button type="button" class="cmap-chip" data-goto="${i}">
    <span class="dot" style="background:${SUBJECT_COLOR[NODES[i].subject]}"></span>${NODES[i].name}</button>`).join("");
}

function select(id, push) {
  const n = NODES[id];
  if (!n) return;
  selected = id;

  const 전부 = 깊게.checked;
  const pre  = 전부 ? 앞전부(id) : before(id);
  const post = after(id);

  앞집합 = new Set(pre);
  뒤집합 = new Set(post);

  markNodes(id);
  markLines(id);

  /* '전부 보기'에서는 배우는 순서대로 나오므로, 위에서부터 읽으면
     그대로 공부 순서가 된다. 그래서 제목에 그 뜻을 적어 둔다. */
  const 앞제목 = 전부
    ? `먼저 알아야 하는 것 <span class="cmap-count">${pre.length}개 · 배우는 순서</span>`
    : `먼저 알아야 하는 것`;

  panel.innerHTML = `
    <div class="cmap-panel-head">
      <span class="caption">${n.year} · ${n.subject}</span>
      <h2 class="headline">${n.name}</h2>
      <p class="body-sm">${n.about}</p>
    </div>
    <div class="cmap-panel-grid">
      <div>
        <h3 class="caption">${앞제목}</h3>
        <div class="cmap-chips">${chips(pre, "없음 — 여기서 출발합니다")}</div>
      </div>
      <div>
        <h3 class="caption">여기서 이어지는 것</h3>
        <div class="cmap-chips">${chips(post, "고등학교 과정에서는 여기가 끝입니다")}</div>
      </div>
      <div>
        <h3 class="caption">직접 보는 수학</h3>
        <div class="cmap-links">${
          n.demos.length
            ? n.demos.map(d => `<a href="${d.h}">${d.t} →</a>`).join("")
            : `<span class="cmap-none">이 개념은 아직 볼 자료가 없습니다</span>`
        }</div>
      </div>
      <div>
        <h3 class="caption">풀어 보는 학습지</h3>
        <div class="cmap-links">${
          학습지(id).length
            ? 학습지(id).map(f =>
                `<a href="${안전하게(f.url)}" target="_blank" rel="noopener">${안전하게(f.title)} ↓</a>`
              ).join("")
            : `<span class="cmap-none">이 개념은 아직 학습지가 없습니다</span>`
        }</div>
      </div>
    </div>`;

  if (push) history.replaceState(null, "", "?n=" + id);

  /* 폰에서는 설명칸이 개념 상자들 '아래'에 있어서, 상자를 눌러도 화면에
     아무 변화가 없는 것처럼 보인다(설명이 두 화면쯤 밑에 있다). 그래서
     눌러서 고른 경우에는 설명칸이 보이도록 따라 내려간다.

     조건을 '화면 아래로 완전히 벗어났을 때'로 좁힌 이유: 넓은 화면에서는
     설명칸 윗부분이 조금이라도 걸쳐 보이면 거기 뭔가 있다는 게 전해지고,
     그때 화면이 저절로 움직이면 오히려 지도를 놓친다. */
  if (push && panel.getBoundingClientRect().top >= innerHeight) {
    panel.scrollIntoView({ block: "start", behavior: "smooth" });
  }
}

function clearPanel() {
  panel.innerHTML = `<p class="cmap-hint body-sm">개념을 하나 눌러 보세요. 그 개념이
    <b>어디서 왔고 어디로 이어지는지</b> 지도에 표시되고, 볼 수 있는 자료가 여기에 나옵니다.</p>`;
}

cmap.addEventListener("click", e => {
  const btn = e.target.closest(".cmap-node");
  if (btn) select(btn.dataset.id, true);
});

/* 스위치를 켜고 끄면 고른 개념을 그대로 두고 다시 칠합니다.
   (아무것도 안 고른 상태에서 켜면 보여 줄 것이 없으므로 그냥 둡니다) */
깊게.addEventListener("change", () => { if (selected) select(selected, false); });
panel.addEventListener("click", e => {
  const chip = e.target.closest(".cmap-chip");
  if (!chip) return;

  /* 설명칸이 화면 밖에 있는 좁은 화면에서는 select() 가 설명칸으로 따라
     내려간다. 그 뒤에 여기서 상자로 도로 올라가면 방금 연 설명을 놓치므로,
     설명칸이 이미 보이는 넓은 화면에서만 상자를 가운데로 옮겨
     '지도에서 어디로 옮겨 갔는지' 보여 준다. */
  const 설명이멀리 = panel.getBoundingClientRect().top >= innerHeight;
  select(chip.dataset.goto, true);
  if (!설명이멀리) {
    nodeEl(chip.dataset.goto).scrollIntoView({ block: "center", behavior: "smooth" });
  }
});

clearPanel();
drawLines();

/* 자료실에서 학습지 목록을 받아 옵니다. 늦게 도착하므로, 도착하면
   상자의 숫자(볼 것 + 풀 것)를 다시 세고, 열려 있던 개념도 다시 그립니다. */
fetch("/api/files")
  .then(r => (r.ok ? r.json() : []))
  .then(목록 => {
    파일들 = Array.isArray(목록) ? 목록 : [];
    if (!파일들.length) return;
    for (const id of Object.keys(NODES)) {
      const 배지 = nodeEl(id)?.querySelector(".cmap-node-n");
      if (!배지) continue;
      const 합 = NODES[id].demos.length + 학습지(id).length;
      배지.textContent = 합;
      배지.hidden = !합;
    }
    drawLines();                       // 배지가 생기면 상자 크기가 바뀔 수 있다
    if (selected) select(selected, false);
  })
  .catch(() => {});

// 폭이 바뀌면 상자가 다시 배치되므로 선도 다시 그린다
addEventListener("resize", drawLines);
if (window.ResizeObserver) new ResizeObserver(drawLines).observe(cmap);
// 글꼴이 늦게 불러와져 상자 크기가 바뀌는 경우까지
if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawLines);

// ?n=trig 처럼 개념을 지정해 링크를 보낼 수 있습니다
{
  const want = new URLSearchParams(location.search).get("n");
  if (want && NODES[want]) select(want, false);
}
</script>
