<!-- ===================== 질문 (학생 → 선생님) ===================== -->
<section class="section" id="ask" style="padding-top: var(--xxl);">
  <div class="wrap">
    <div class="block block-navy">
      <span class="eyebrow">Q &amp; A</span>
      <h1 class="display-lg">공부 방법, 편하게 물어보세요</h1>
      <p class="subhead" style="margin-top: 24px; max-width: 27em;">
        문제 풀이가 아니라 <b>공부하는 방법</b>에 대한 질문을 받습니다.
        오답노트는 언제 다시 봐야 할지, 인강과 학교 수업 중 뭘 먼저 챙겨야
        할지, 시험 2주 전엔 뭘 해야 할지 — 그런 것들요.
      </p>
      <p class="body-sm" style="margin-top: 12px; max-width: 30em; opacity: .8;">
        이름도, 로그인도 필요 없습니다. 완전히 익명입니다.
      </p>
      <!-- 질문 쓰는 곳. 이름을 묻지 않으므로 완전히 익명입니다.
           아래 script 의 폼주소 에 Formspree 주소를 넣으면 실제로 전송됩니다.
           비워 두면 칸이 잠기고 안내 문구만 보입니다. -->
      <form id="askForm" class="qform">
        <div class="qform-row">
          <label for="qGrade">학년 (선택)</label>
          <input type="text" id="qGrade" name="학년" placeholder="예: 고2 — 안 적어도 됩니다" />
        </div>
        <div class="qform-row">
          <label for="qBody">질문 내용</label>
          <textarea id="qBody" name="질문" rows="5" required
            placeholder="예: 오답노트는 언제 다시 봐야 할까요?"></textarea>
        </div>
        <button type="submit" class="btn btn-secondary">질문 남기기 →</button>
        <p class="qform-status caption" role="status" aria-live="polite"></p>
      </form>

      <h2 class="caption" style="margin: 40px 0 0;">받은 질문과 답</h2>
      <!-- ✏️ 답변은 아래 script 의 QNA 배열에 한 줄씩 추가하면 됩니다 -->
      <div class="rows" id="qna"></div>
    </div>
  </div>
</section>

<script>
/* =========================================================
   ✏️ 질문 받는 곳 — 아래 따옴표 사이만 채우면 끝입니다.

   구글 폼 대신 이 페이지 자체가 질문을 받습니다 — 학생은 다른 사이트로
   가지 않고, 로그인도 필요 없습니다. 대신 어딘가로 '보내는' 역할을 할
   서비스가 하나 필요한데, 여기서는 Formspree(무료)를 씁니다.

   1) formspree.io 에서 계정을 만들고 New Form 을 누릅니다.
      (양식 이름은 아무거나 좋습니다. 예: "수학을 보다 질문")
   2) 만들어진 주소(Endpoint)를 복사합니다. 이렇게 생겼습니다:
      https://formspree.io/f/abcdwxyz
   3) 아래 따옴표 사이에 붙여 넣습니다.

   학생이 보낸 질문은 Formspree 계정을 만들 때 쓴 이메일로 옵니다.
   ========================================================= */
const 폼주소 = "";

/* ---------- 여기부터는 손대지 않아도 됩니다 ---------- */
{
  const 폼 = document.getElementById("askForm");
  const 상태 = 폼.querySelector(".qform-status");

  if (!폼주소) {
    // 아직 주소를 안 넣었을 때 — 칸을 잠그고 안내만 보여 줍니다
    폼.querySelectorAll("input, textarea, button").forEach(el => el.disabled = true);
    상태.textContent = "질문 받는 곳을 준비하고 있습니다.";
  } else {
    폼.addEventListener("submit", async e => {
      e.preventDefault();
      const 버튼 = 폼.querySelector("button");
      버튼.disabled = true;
      상태.textContent = "보내는 중…";
      try {
        const 응답 = await fetch(폼주소, {
          method: "POST",
          headers: { Accept: "application/json" },
          body: new FormData(폼),
        });
        if (응답.ok) {
          폼.reset();
          상태.textContent = "질문이 전달됐습니다. 고맙습니다.";
        } else {
          상태.textContent = "지금은 안 보내져요. 잠시 뒤 다시 시도해 주세요.";
        }
      } catch (err) {
        상태.textContent = "지금은 안 보내져요. 잠시 뒤 다시 시도해 주세요.";
      } finally {
        버튼.disabled = false;
      }
    });
  }
}

/* =========================================================
   질문 · 답 — 여기에 한 항목씩 추가하면 화면에 올라갑니다.
   최신 것이 위로 오도록 맨 앞에 넣어 주세요.
   ========================================================= */
const QNA = [
  { date: "2026-08-05", tag: "고2",
    q: "오답노트를 어떻게 정리해야 할지 모르겠어요. 문제를 그대로 옮겨 적기만 하고 있어요.",
    a: "문제를 베끼지 말고, '왜 틀렸는지' 한 줄만 적으세요. 계산 실수인지, 개념을 몰랐는지, 문제를 잘못 읽었는지에 따라 다음에 조심할 게 다릅니다. 그 한 줄이 시험 전에 다시 볼 때 진짜 도움이 됩니다." },

  { date: "2026-07-28", tag: "고3",
    q: "인강이랑 학교 수업 중에 뭘 더 우선해야 하나요?",
    a: "학교 진도를 먼저 따라가세요. 인강은 학교에서 놓친 부분을 메우는 용도로 쓰는 게 낫습니다. 둘을 동시에 처음부터 끝까지 들으려 하면 어느 쪽도 제대로 안 남습니다." }
];

document.getElementById("qna").innerHTML = QNA.map(it => `
  <article>
    <span class="caption">${it.date} · ${it.tag}</span>
    <h3 class="card-title"><span class="qa-mark">Q</span>${it.q}</h3>
    <p class="body-sm"><span class="qa-mark">A</span>${it.a}</p>
  </article>`).join("");
</script>
