<script>
/* =========================================================
   질문 · 답 — 여기에 한 항목씩 추가하면 화면에 올라갑니다.
   최신 것이 위로 오도록 맨 앞에 넣어 주세요.
   ========================================================= */
const QNA = [
  { date: "2026-07-30", tag: "기하 · 공간도형",
    q: "정사영 넓이 문제에서 cos θ 를 어디에 곱하는지 자꾸 헷갈려요.",
    a: "교선과 나란한 방향은 길이가 그대로고, 교선과 수직인 방향만 cos θ 배로 줄어듭니다. 자료실의 정사영 자료에서 각을 0°와 90°로 놓고 보면 한 번에 정리됩니다." },

  { date: "2026-07-22", tag: "미적분Ⅰ · 미분",
    q: "순간변화율이랑 평균변화율이 뭐가 다른 거예요?",
    a: "평균변화율은 두 점을 잇는 직선의 기울기, 순간변화율은 그 두 점이 붙었을 때의 기울기입니다. 자료실의 ‘미분계수는 접선의 기울기’에서 h 를 0으로 보내 보면 할선이 접선에 붙는 게 보입니다." }
];

document.getElementById("qna").innerHTML = QNA.map(it => `
  <article>
    <span class="caption">${it.date} · ${it.tag}</span>
    <h3 class="card-title"><span class="qa-mark">Q</span>${it.q}</h3>
    <p class="body-sm"><span class="qa-mark">A</span>${it.a}</p>
  </article>`).join("");
</script>
